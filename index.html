  /* ==== LA-CSS BEGIN ==== */

  .la-root{margin:4px 0 2px}

  .la-svg rect.la-half{fill:none;stroke:#c26a00;stroke-width:2;stroke-dasharray:4 3}
  .la-svg *{transform-box:fill-box;transform-origin:center}
  .la-a{animation:la-pop .5s ease-out both}
  .la-o{animation:la-fade .5s ease-out both}
  .la-f{animation:la-fin .5s ease-out both}
  .la-mv{animation:la-move .8s ease-in-out both}
  .la-mvx{opacity:0;animation:la-movex 1.4s ease-in-out both}

  @keyframes la-pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes la-fade{from{opacity:0}to{opacity:1}}
  @keyframes la-fin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
  @keyframes la-move{from{transform:translate(var(--la-dx,0px),var(--la-dy,0px))}to{transform:none}}
  @keyframes la-movex{0%{opacity:1;transform:translate(var(--la-dx,0px),var(--la-dy,0px))}60%{opacity:1;transform:none}to{opacity:0;transform:none}}
  @keyframes la-hop{0%{transform:translate(var(--la-dx,0px),0px)}25%{transform:translate(var(--la-dx,0px),0px)}45%{transform:translate(var(--la-dx1,0px),0px)}60%{transform:translate(var(--la-dx1,0px),0px)}80%{transform:none}to{transform:none}}
  .la-still *{animation:none!important}

  /* รหัสสีตามบทบาท (data-role) — ใช้ทั้งบท · ใช้ #app ให้ชนะคลาสสีอื่นเสมอ */
  #app [data-role="dd"]{fill:#1d4ed8;color:#1d4ed8}

  .la-lg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#6b7194;margin:0 0 6px}

  /* โฟกัส: ส่วนที่กำลังพูดถึงชัด ส่วนอื่นจาง (ใช้ fill/stroke-opacity ไม่ชน opacity ของอนิเมชั่น) */

<script>
'use strict';
/* ================= version check (กันหน้าเก่าค้างในเครื่อง) ================= */
const VERSION='20261109a';
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const m=(await r.text()).match(/const VERSION='([^']+)'/);
    if(m&&m[1]!==VERSION&&!document.getElementById('updbar')){
      const b=document.createElement('div');b.id='updbar';
      b.textContent='🔄 มีเวอร์ชันใหม่ของเกม — แตะที่นี่เพื่ออัปเดต';
      b.onclick=()=>location.reload();
      document.body.prepend(b);
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
setTimeout(checkUpdate,3000);
/* ================= utils ================= */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
/* จำนวนทั้งหมดเก็บเป็นจำนวนเต็มคูณ 10^d เพื่อเลี่ยง floating point */
function fmt(v,d){v=Math.round(v);const neg=v<0;v=Math.abs(v);const s=String(v).padStart(d+1,'0');
  const o=d? s.slice(0,-d)+'.'+s.slice(-d) : s; return (neg?'−':'')+o;}
function ftr(v,d){let s=fmt(v,d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s;}
function genv(i1,i2,d){const ip=ri(i1,i2);let f;do{f=ri(1,10**d-1);}while(f%10===0);return ip*10**d+f;}
function gen3(i1,i2,dp){return genv(i1,i2,dp)*10**(3-dp);} /* คืนค่าในสเกล 1/1000 */

/* สร้างตัวเลือกปรนัย 4 ข้อจากคำตอบที่ถูก (cv สเกล 10^d) */
function mcNum(cv,d,opt={}){
  const trim=opt.trim!==false;
  const F=v=>trim?ftr(v,d):fmt(v,d);
  const unit=10**Math.max(0,d-2);
  const deltas=shuffle([1,-1,10,-10,100,-100,9,-9,11,-11]).map(x=>x*unit);
  const set=new Set([F(cv)]);const vals=[cv];
  const abs=(opt.extraVals||[]).slice();let n=1;
  while(vals.length<4){
    let v;
    if(abs.length)v=abs.shift();
    else if(deltas.length)v=cv+deltas.shift();
    else v=cv+(n++)*unit*3;
    v=Math.round(v);
    if(!(v>0))continue;
    const s=F(v);
    if(!set.has(s)){set.add(s);vals.push(v);}
  }
  const ord=shuffle([0,1,2,3]);
  return {choices:ord.map(i=>F(vals[i])),correct:ord.indexOf(0)};
}

/* ================= บทที่ 1 : ทศนิยมเบื้องต้น ================= */
function g_place(){
  const ds=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4);
  const numStr=`${ds[0]}.${ds[1]}${ds[2]}${ds[3]}`;
  const pos=ri(1,3), dg=ds[pos], variant=ri(0,2);
  let q,choices;
  if(variant===0){
    q=`${numStr} ตัวเลข ${dg} อยู่ในหลักใด`;
    choices=['หลักหน่วย','หลักส่วนสิบ','หลักส่วนร้อย','หลักส่วนพัน'];
  }else if(variant===1){
    q=`${numStr} ตัวเลข ${dg} มีค่าเท่าไร`;
    choices=[`${dg}`,ftr(dg*100,3),ftr(dg*10,3),ftr(dg,3)];
  }else{
    q=`${numStr} ตัวเลข ${dg} มีค่าประจำหลักเท่ากับข้อใด`;
    choices=['1','1/10','1/100','1/1000'];
  }
  return {sec:'ค่าประจำหลัก',q,choices,correct:pos,sig:`p|${numStr}|${pos}|${variant}`,
    ex:`เลข ${dg} อยู่ตำแหน่งที่ ${pos} หลังจุดทศนิยม คือหลัก${['','ส่วนสิบ','ส่วนร้อย','ส่วนพัน'][pos]} จึงมีค่า ${ftr(dg*10**(3-pos),3)} (ค่าประจำหลัก 1/${10**pos})`};
}
function g_expand(){
  const T=ri(1,9),O=ri(0,9),h=ri(1,9),k=ri(1,9);
  const decs=ri(0,1)===0?[0,h,k]:[h,0,k];
  const numStr=`${T}${O}.${decs.join('')}`;
  const fr=[];decs.forEach((d,i)=>{if(d)fr.push({d,i});});
  const mk=mode=>{
    const parts=[String(T*10)];if(O)parts.push(String(O));
    fr.forEach((f,idx)=>{
      let m=1; /* ตัวลวง: คูณ 10 ผิดตำแหน่ง (ทุกพจน์/พจน์แรก/พจน์สุดท้าย) */
      if(mode==='A')m=10;
      else if(mode==='B'&&idx===0)m=10;
      else if(mode==='C'&&idx===fr.length-1)m=10;
      parts.push(ftr(f.d*10**(3-f.i)*m,4));
    });
    return parts.join(' + ');
  };
  const opts=[mk('X'),mk('A'),mk('B'),mk('C')];
  const ord=shuffle([0,1,2,3]);
  return {sec:'การกระจาย',q:`${numStr} เขียนในรูปกระจายได้ตรงกับข้อใด`,
    choices:ord.map(i=>opts[i]),correct:ord.indexOf(0),sig:`e|${numStr}`,
    ex:`คิดค่าทีละหลักแล้วนำมาบวกกัน: ${numStr} = ${opts[0]} (หลักที่เป็น 0 ไม่ต้องเขียน)`};
}
function g_compare(lv){
  const st=lv===1?10:1;
  const X=lv===1?gen3(10,99,2):genv(10,99,3), more=ri(0,1)===0, t=more?1:-1;
  const set=new Set([ftr(X,3)]);const vals=[];
  const cv=X+t*ri(1,45)*st;vals.push(cv);set.add(ftr(cv,3));
  while(vals.length<4){const v=X-t*ri(1,45)*st;const s=ftr(v,3);
    if(!set.has(s)){set.add(s);vals.push(v);}}
  const ord=shuffle([0,1,2,3]);
  return {sec:'การเปรียบเทียบ',q:`จำนวนใดมีค่า${more?'มากกว่า':'น้อยกว่า'} ${ftr(X,3)}`,
    choices:ord.map(i=>ftr(vals[i],3)),correct:ord.indexOf(0),sig:`c|${X}|${more}`,
    ex:`เติม 0 ให้ตำแหน่งเท่ากัน แล้วเทียบทีละหลักจากซ้ายไปขวา — ${ftr(cv,3)} ${more?'มากกว่า':'น้อยกว่า'} ${ftr(X,3)} ส่วนตัวเลือกอื่น${more?'น้อยกว่า':'มากกว่า'}ทั้งหมด`};
}
function g_order(){
  const x=ri(1,9),I=ri(1,99),desc=ri(0,1)===0;
  const items=[{v:x*100,s:`${I}.${x}`},{v:x*10,s:`${I}.0${x}`},
               {v:x*110,s:`${I}.${x}${x}`},{v:x*11,s:`${I}.0${x}${x}`}];
  const correctStr=items.slice().sort((a,b)=>desc?b.v-a.v:a.v-b.v).map(o=>o.s).join(' , ');
  const set=new Set([correctStr]);const opts=[correctStr];let g=0;
  while(opts.length<4&&g<200){g++;
    const p=shuffle(items.map(o=>o.s)).join(' , ');
    if(!set.has(p)){set.add(p);opts.push(p);}}
  const shown=shuffle(items.map(o=>o.s)).join('  ,  ');
  const ord=shuffle([0,1,2,3]);
  return {sec:'การเรียงลำดับ',
    q:`กำหนด ${shown} เรียงลำดับจาก${desc?'มากไปน้อย':'น้อยไปมาก'}ได้ตรงกับข้อใด`,
    choices:ord.map(i=>opts[i]),correct:ord.indexOf(0),sig:`o|${I}|${x}|${desc}`,
    ex:`เติม 0 ให้ครบ 3 ตำแหน่งแล้วเทียบทีละหลัก จะเรียงได้ ${correctStr}`};
}
const FRAC_POOL=[[1,2,500],[1,4,250],[3,4,750],[1,5,200],[2,5,400],[3,5,600],[4,5,800],
 [3,20,150],[7,20,350],[9,20,450],[11,20,550],[13,20,650],[17,20,850],[19,20,950],

function g_frac(lv){
  const v=lv===1?ri(0,1):lv===3?ri(1,2):ri(0,2);
  if(v===0){
    const den=pick(lv===1?[10,100]:[10,100,1000]);let n;do{n=ri(1,den-1);}while(n%10===0);
    const set=new Set();const opts=[];
    const push=(a,b)=>{const s=`${a}/${b}`;if(!set.has(s)){set.add(s);opts.push(s);}};
    push(n,den);[[n,10],[n,100],[n,1000]].forEach(x=>push(x[0],x[1]));push(n*10,den);
    const four=opts.slice(0,4);const ord=shuffle([0,1,2,3]);
    return {sec:'ทศนิยมกับเศษส่วน',q:`${ftr(n*(1000/den),3)} เขียนเป็นเศษส่วนได้ตรงกับข้อใด`,
      choices:ord.map(i=>four[i]),correct:ord.indexOf(0),sig:`f0|${n}|${den}`,
      ex:`${ftr(n*(1000/den),3)} มีทศนิยม ${String(den).length-1} ตำแหน่ง ตัวส่วนจึงเป็น ${den} → ${n}/${den}`};
  }
  if(v===1){
    const [n,d,val]=pick(lv===1?FRAC_POOL.slice(0,7):lv===3?FRAC_POOL.slice(7):FRAC_POOL);
    const r=mcNum(val,3,{extraVals:[val*10,Math.max(1,Math.round(val/10))]});
    return {sec:'ทศนิยมกับเศษส่วน',q:`เศษส่วน ${n}/${d} เขียนเป็นทศนิยมได้ตรงกับข้อใด`,
      choices:r.choices,correct:r.correct,sig:`f1|${n}|${d}`,
      ex:`ทำตัวส่วนให้เป็น 100: ${n}/${d} = ${n*100/d}/100 = ${ftr(val,3)}`};
  }
  let p;do{p=ri(5,99);}while(p%10===0);
  const r=mcNum(p*10,3,{extraVals:[p*100,p]});
  return {sec:'ทศนิยมกับเศษส่วน',q:`ร้อยละ ${p} เขียนเป็นทศนิยมได้ตรงกับข้อใด`,
    choices:r.choices,correct:r.correct,sig:`f2|${p}`,
    ex:`ร้อยละ ${p} คือ ${p}/100 = ${ftr(p*10,3)}`};
}
function g_round(lv){
  const v=lv===1?0:lv===3?ri(1,2):ri(0,2);
  if(v===0){
    const x=lv===1?gen3(1,99,2):genv(1,99,3),rv=Math.round(x/100);
    const fl=Math.floor(x/100);
    const r=mcNum(rv,1,{trim:false,extraVals:fl!==rv?[fl]:[]});
    return {sec:'ค่าประมาณ',q:`ค่าประมาณของ ${ftr(x,3)} เป็นทศนิยม 1 ตำแหน่ง ตรงกับข้อใด`,
      choices:r.choices,correct:r.correct,sig:`r0|${x}`,
      ex:`ดูเลขตำแหน่งถัดไป (ส่วนร้อย) คือ ${Math.floor(x/10)%10} ${Math.floor(x/10)%10>=5?'ถึง 5 ปัดขึ้น':'ไม่ถึง 5 ปัดทิ้ง'} จึงได้ ${fmt(rv,1)}`,exsvg:svgRoundLine(x,1)};
  }
  if(v===1){
    const x=genv(1,99,3),rv=Math.round(x/10);
    const fl=Math.floor(x/10);
    const r=mcNum(rv,2,{trim:false,extraVals:fl!==rv?[fl]:[]});
    return {sec:'ค่าประมาณ',q:`ค่าประมาณของ ${ftr(x,3)} เป็นทศนิยม 2 ตำแหน่ง ตรงกับข้อใด`,
      choices:r.choices,correct:r.correct,sig:`r1|${x}`,
      ex:`ดูเลขตำแหน่งถัดไป (ส่วนพัน) คือ ${x%10} ${x%10>=5?'ถึง 5 ปัดขึ้น':'ไม่ถึง 5 ปัดทิ้ง'} จึงได้ ${fmt(rv,2)}`,exsvg:svgRoundLine(x,2)};
  }
  const t=ri(11,989);
  const mk=tt=>{let vv=tt*100+ri(-40,40);if(vv%10===0)vv+=1;return vv;};
  const vals=[mk(t),mk(t+1),mk(t-1),mk(t+2)];
  const ord=shuffle([0,1,2,3]);
  return {sec:'ค่าประมาณ',
    q:`จำนวนในข้อใดมีค่าประมาณเป็นทศนิยม 1 ตำแหน่งเป็น ${fmt(t,1)}`,
    choices:ord.map(i=>fmt(vals[i],3)),correct:ord.indexOf(0),sig:`r2|${vals[0]}`,
    ex:`${fmt(vals[0],3)} ปัดเศษที่ตำแหน่งส่วนร้อยแล้วได้ ${fmt(t,1)} พอดี ส่วนตัวเลือกอื่นปัดแล้วไม่ตรง`,exsvg:svgRoundLine(vals[0],1)};
}

function g_add(lv){
  const three=lv===1?false:lv===3?ri(0,1)===0:ri(0,3)===0;
  if(three){
    const a=gen3(1,9,1),b=gen3(0,9,2),c=gen3(0,9,3);
    const disp=`${ftr(a,3)} + ${ftr(b,3)} + ${ftr(c,3)}`;
    const r=mcNum(a+b+c,3);
    return {sec:'การบวกทศนิยม',q:`${disp} มีค่าเท่าไร`,choices:r.choices,correct:r.correct,sig:`a3|${a}|${b}|${c}`,
      ex:`ตั้งจุดให้ตรงกัน เติม 0 ให้ครบทุกตัว แล้วบวกทีละหลัก: ${disp} = ${ftr(a+b+c,3)}`};
  }
  const a=lv===1?gen3(0,50,pick([1,2])):gen3(0,89,pick([2,3])),b=lv===1?gen3(0,30,pick([1,2])):gen3(0,49,pick([2,3]));
  const r=mcNum(a+b,3);
  return {sec:'การบวกทศนิยม',q:`${ftr(a,3)} + ${ftr(b,3)} มีค่าเท่าไร`,
    choices:r.choices,correct:r.correct,sig:`a2|${a}|${b}`,
    ex:`ตั้งจุดให้ตรงกัน เติม 0 ให้ตำแหน่งเท่ากัน แล้วบวก: ${ftr(a,3)} + ${ftr(b,3)} = ${ftr(a+b,3)}`};
}
function g_sub(lv){
  const iv=lv===1?false:lv===3?ri(0,1)===0:ri(0,2)===2;
  if(iv){
    const M=ri(20,400),b=gen3(1,Math.min(99,M-2),2);
    const r=mcNum(M*1000-b,3);
    return {sec:'การลบทศนิยม',q:`${M} − ${ftr(b,3)} มีค่าเท่าไร`,
      choices:r.choices,correct:r.correct,sig:`s1|${M}|${b}`,
      ex:`เขียน ${M} เป็นทศนิยมก่อน (เติมจุดกับ 0) แล้วตั้งลบ: ${M} − ${ftr(b,3)} = ${ftr(M*1000-b,3)}`};
  }
  let a=gen3(1,lv===1?50:99,pick(lv===1?[1,2]:[2,3])),b=gen3(1,lv===1?50:99,pick(lv===1?[1,2]:[2,3]));
  if(a===b)a+=1230;
  if(a<b){const t=a;a=b;b=t;}
  const r=mcNum(a-b,3);
  return {sec:'การลบทศนิยม',q:`${ftr(a,3)} − ${ftr(b,3)} มีค่าเท่าไร`,
    choices:r.choices,correct:r.correct,sig:`s0|${a}|${b}`,
    ex:`ตั้งจุดให้ตรงกัน เติม 0 แล้วลบทีละหลัก (ยืมได้เหมือนจำนวนเต็ม): ${ftr(a,3)} − ${ftr(b,3)} = ${ftr(a-b,3)}`};
}
function g_miss(){

  let q,ans,extra;
  if(f===0){q=`${ftr(a,2)} + □ = ${ftr(a+x,2)} จำนวนใน □ มีค่าเท่าไร`;ans=x;extra=[a+x+a];}
  else if(f===1){q=`□ − ${ftr(a,2)} = ${ftr(x,2)} จำนวนใน □ มีค่าเท่าไร`;ans=a+x;extra=[Math.abs(x-a)||x+1];}
  else{q=`${ftr(a+x,2)} − □ = ${ftr(x,2)} จำนวนใน □ มีค่าเท่าไร`;ans=a;extra=[a+x+x];}
  const r=mcNum(ans,2,{extraVals:extra});
  const exm=f===0?`ย้ายข้าง: □ = ${ftr(a+x,2)} − ${ftr(a,2)} = ${ftr(x,2)}`
    :f===1?`ย้ายข้าง: □ = ${ftr(x,2)} + ${ftr(a,2)} = ${ftr(a+x,2)}`
    :`ย้ายข้าง: □ = ${ftr(a+x,2)} − ${ftr(x,2)} = ${ftr(a,2)}`;
  return {sec:'หาจำนวนที่หายไป',q,choices:r.choices,correct:r.correct,sig:`m|${f}|${a}|${x}`,ex:exm};
}
function g_cmp2(){

  const rset=new Set();const rs=[];
  while(rs.length<4){const r=base+ri(-90,90);if(!rset.has(r)){rset.add(r);rs.push(r);}}
  const exprs=rs.map(r=>{
    if(isSum){const a=ri(5000,r-5000);return {r,s:`${fmt(a,2)} + ${fmt(r-a,2)}`};}
    const b=ri(5000,30000);return {r,s:`${fmt(b+r,2)} − ${fmt(b,2)}`};
  });
  let ci=0;exprs.forEach((e,i)=>{if(wantMax?e.r>exprs[ci].r:e.r<exprs[ci].r)ci=i;});
  return {sec:'เปรียบเทียบผลลัพธ์',
    q:`${isSum?'ผลบวก':'ผลลบ'}ข้อใดมีค่า${wantMax?'มากที่สุด':'น้อยที่สุด'}`,
    choices:exprs.map(e=>e.s),correct:ci,sig:`q|${rs.join(',')}|${isSum}|${wantMax}`,
    ex:`คิดทีละข้อ: ${exprs.map((e,i)=>`${['ก','ข','ค','ง'][i]}. ${e.s} = ${fmt(e.r,2)}`).join(' • ')} → ${wantMax?'มากที่สุด':'น้อยที่สุด'}คือข้อ ${['ก','ข','ค','ง'][ci]}`};
}

const f4=v=>ftr(v,4);
function d3_mul(lv){
  const dp=lv===1?2:pick([2,3]);
  const a=genv(1,dp===2?99:9,dp), va=a*10**(4-dp);
  const f=pick(lv===1?[10,100]:[10,100,1000]);
  const ans=va*f;
  const r=mcNum(ans,4,{extraVals:[ans*10,ans/10,va]});
  const q=ri(0,1)===0?`${f4(va)} × ${f} มีค่าเท่าไร`:`${f} เท่าของ ${f4(va)} มีค่าเท่าไร`;
  return {sec:'คูณด้วย 10 100 1000',q,choices:r.choices,correct:r.correct,sig:`3m|${va}|${f}`,
    ex:`คูณ ${f} จุดทศนิยมเลื่อนไปทางขวา ${String(f).length-1} ตำแหน่ง: ${f4(va)} → ${f4(ans)}`};
}
function d3_div(lv){
  const f=pick(lv===1?[10]:lv===3?[100,1000]:[10,100,1000]);
  /* จำกัดตำแหน่งทศนิยมของตัวตั้ง ให้ผลหารไม่เกิน 4 ตำแหน่ง */
  const adp=f===1000?1:f===100?ri(1,2):ri(1,3);
  const a2=genv(1,99,adp), va=a2*10**(4-adp);
  const ans=va/f;
  const r=mcNum(ans,4,{extraVals:[va*f,ans*10,va]});
  const q=ri(0,1)===0?`${f4(va)} ÷ ${f} มีค่าเท่าไร`:`1 ใน ${f} ของ ${f4(va)} มีค่าเท่าไร`;
  return {sec:'หารด้วย 10 100 1000',q,choices:r.choices,correct:r.correct,sig:`3d|${va}|${f}`,
    ex:`หารด้วย ${f} จุดทศนิยมเลื่อนไปทางซ้าย ${String(f).length-1} ตำแหน่ง: ${f4(va)} → ${f4(ans)} (ไม่มีตัวเลขให้เติม 0)`};

const UCONV=[

function svgPara(bL,hL,sL){
  const x0=28,y0=14,bw=140,hh=66,off=38,yb=y0+hh;
  return `<svg width="250" height="112" viewBox="0 0 250 112">`
   +`<polygon points="${x0+off},${y0} ${x0+off+bw},${y0} ${x0+bw},${yb} ${x0},${yb}" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>`
   +`<line x1="${x0+off}" y1="${y0}" x2="${x0+off}" y2="${yb}" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>`
   +`<path d="M ${x0+off} ${yb-9} h 9 v 9" fill="none" stroke="#dc2626" stroke-width="1.5"/>`
   +`<text x="${x0+bw/2+30}" y="${yb+14}" text-anchor="middle" font-size="13" fill="#1e40af">${bL}</text>`
   +`<text x="${x0+off+8}" y="${y0+hh/2+4}" font-size="13" fill="#dc2626">${hL}</text>`
   +`<text x="${x0+off/2-22}" y="${y0+hh/2+4}" font-size="13" fill="#475569">${sL}</text>`
   +`</svg>`;
}
function svgTri(bL,hL,sL,obtuse){
  const x0=30,yb=92,bw=140,y0=14;

  const ext=obtuse?`<line x1="${x0+bw}" y1="${yb}" x2="${ax}" y2="${yb}" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>`:'';
  return `<svg width="260" height="112" viewBox="0 0 260 112">`
   +ext
   +`<polygon points="${x0},${yb} ${x0+bw},${yb} ${ax},${y0}" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>`
   +`<line x1="${ax}" y1="${y0}" x2="${ax}" y2="${yb}" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4"/>`
   +`<path d="M ${ax-9} ${yb} v -9 h 9" fill="none" stroke="#dc2626" stroke-width="1.5"/>`
   +`<text x="${x0+bw/2}" y="${yb+14}" text-anchor="middle" font-size="13" fill="#92400e">${bL}</text>`
   +`<text x="${ax+6}" y="${(y0+yb)/2+4}" font-size="13" fill="#dc2626">${hL}</text>`

/* ================= บทที่ 6 : การคูณและหารทศนิยม ================= */
function g6_mul(lv){
  const da=lv===1?1:lv===3?2:pick([1,2]), db=lv===1?1:lv===3?2:pick([1,2]);

  /* ตัวเลือกทุกข้อทศนิยมเท่ากันและค่าใกล้กัน (กันเดาโดยนับจุด) — ตัวลวงคือผลคูณที่คูณพลาดจริง */
  const r=mcNum(a*b,dd,{trim:false,extraVals:[(a+1)*b,a*(b+1),(a-1)*b]});
  return {sec:'การคูณทศนิยม',
    q:`${ftr(a*10**(4-da),4)} × ${ftr(b*10**(4-db),4)} มีค่าเท่าไร`,
    choices:r.choices,correct:r.correct,sig:`6m|${a}|${b}|${p4}`,
    ex:`ขั้น 1 คูณแบบไม่มีจุด: ${a} × ${b} = ${a*b} • ขั้น 2 นับตำแหน่งจุดรวม ${da}+${db} = ${dd} ตำแหน่ง • ขั้น 3 ใส่จุด → ${fmt(a*b,dd)} — ตัวเลือกทุกข้อจุดเท่ากันหมด ต้องคูณจริงเท่านั้น`};
}

    extras=[r*10,Math.round(r/10)]; sig=`6w|avg|${ans}|${U}`;

  }else if(t===2){ /* แบ่งใส่ถุง */

    extras=[(n+1)*100,(n-1)*100,n*1000]; sig=`6w|bag|${ans}|${g}|${n}`;

/* ================= บทที่ 9 : บวกลบเศษส่วน (แนว Suken ระดับ 7) ================= */
/* เศษส่วนเก็บเป็นจำนวนเต็ม [ตัวเศษ, ตัวส่วน] คำนวณด้วย ห.ร.ม./ค.ร.น. ล้วน ไม่ใช้ทศนิยม
   รูปแบบข้อความ: เศษส่วน "3/8" • จำนวนคละ "2 3/8" (เว้นวรรค 1 ช่อง) — ตัวแสดงผลจะแปลงเป็นเศษส่วนซ้อนเฉพาะข้อที่มี fr:true
   ระวัง: ห้ามเขียน "ตัวเลข เว้นวรรค เศษส่วน" ในข้อความ ถ้าไม่ได้ตั้งใจให้เป็นจำนวนคละ
   lures = ชนิดของแต่ละตัวเลือก (ANS=คำตอบ, L1–L7=จุดพลาดตามแผน, N=ค่าใกล้เคียง, อื่นๆ=ตัวลวงเสริม) ใช้ใน test เท่านั้น ไม่ถูกบันทึกลงประวัติ */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a;}
function lcm(a,b){return a/gcd(a,b)*b;}
function frR(n,d){const g=gcd(n,d);return [n/g,d/g];}                 /* ทอนเป็นอย่างต่ำ */
function frS(n,d){                                                    /* แสดงตามค่าที่ให้ (ไม่ทอน) เกิน 1 เป็นจำนวนคละ */
  if(n%d===0)return String(n/d);
  return n>d?`${Math.floor(n/d)} ${n%d}/${d}`:`${n}/${d}`;
}
function frA(n,d){const r=frR(n,d);return frS(r[0],r[1]);}            /* รูปคำตอบมาตรฐาน: อย่างต่ำ + จำนวนคละ */
function frI(n,d){return `${n}/${d}`;}                                /* เขียนเป็นเศษเกิน/ไม่ทอน */
function tS(t){return t.w?`${t.w} ${t.n}/${t.d}`:`${t.n}/${t.d}`;}   /* พจน์ {w,n,d} → ข้อความ */
function rProper(d){let n;do{n=ri(1,d-1);}while(gcd(n,d)!==1);return n;}
function tm(w,d){return {w,n:rProper(d),d};}                          /* สุ่มพจน์ที่เศษส่วนเป็นอย่างต่ำ */
const LCAP={1:36,2:60,3:90};                                          /* ค.ร.น. สูงสุดต่อระดับ */

/* สร้างตัวเลือก 4 ข้อ: ans=[n,d] อย่างต่ำ • cands=[{v:[n,d],t:'L1',s?:ข้อความ}] เรียงตามลำดับความสำคัญ
   - ค่าทุกตัวเลือกต้องไม่ซ้ำกัน และไม่เท่าคำตอบ ยกเว้น L7 (ค่าเท่าคำตอบแต่ไม่อย่างต่ำ — ใช้เฉพาะ Advance)
   - ไม่ใช้ค่าที่เป็นจำนวนเต็มพอดีหรือไม่เป็นบวก • คืน null ถ้าไม่มีตัวลวง L1–L6 เหลือ (ให้สุ่มโจทย์ใหม่) */
function mcFrac(ans,cands,o={}){
  const fmtv=o.fmt||frA, key=v=>{const r=frR(v[0],v[1]);return r[0]+'/'+r[1];};
  const aK=key(ans);
  const opts=[{s:o.ansS||frS(ans[0],ans[1]),t:'ANS'}];
  const seenS=new Set([opts[0].s]),seenV=new Set([aK]);
  const tryAdd=c=>{
    if(!c||opts.length>=4)return;
    const v=c.v;
    if(!(v[0]>0&&v[1]>0)||v[0]%v[1]===0)return;
    if(o.proper&&v[0]>v[1])return;                   /* โจทย์ทอนอย่างต่ำ: ตัวเลือกเป็นเศษส่วนแท้ทั้งหมด */
    const s=c.s||fmtv(v[0],v[1]),k=key(v);
    if(seenS.has(s))return;
    if(c.t==='L7'){if(k!==aK||opts.some(x=>x.t==='L7'))return;}
    else if(seenV.has(k))return;
    seenS.add(s);seenV.add(k);opts.push({s,t:c.t});
  };
  cands.forEach(tryAdd);
  if(!opts.some(x=>/^L[1-6]$/.test(x.t)))return null;
  for(let k=1;opts.length<4&&k<60;k++)for(const sg of shuffle([1,-1]))tryAdd({v:[ans[0]+sg*k,ans[1]],t:'N'});
  if(opts.length<4)return null;
  const ord=shuffle([0,1,2,3]),u=o.unit?' '+o.unit:'';
  return {choices:ord.map(i=>opts[i].s+u),correct:ord.indexOf(0),lures:ord.map(i=>opts[i].t)};
}

/* ตัวลวงจากจุดพลาดจริงของโจทย์บวก/ลบ (T=พจน์, sg=เครื่องหมายของแต่ละพจน์, L=ค.ร.น.) */
function frLures(T,ops,sg,ans,L){
  const W=T.reduce((a,t,i)=>a+sg[i]*t.w,0);
  const Lc=[],oc=[];
  if(ops.every(x=>x==='+')){                       /* L1 บวกเศษบวกส่วนตรงๆ */
    const SN=T.reduce((a,t)=>a+t.n,0),SD=T.reduce((a,t)=>a+t.d,0);
    Lc.push({v:[W*SD+SN,SD],t:'L1'});
  }else if(T.length===2&&T[0].n>T[1].n&&T[0].d-T[1].d>=2){   /* L1 ลบเศษลบส่วนตรงๆ */
    const D=T[0].d-T[1].d;Lc.push({v:[W*D+T[0].n-T[1].n,D],t:'L1'});
  }
  const N2=T.reduce((a,t,i)=>a+sg[i]*t.n,0);       /* L2 ทำส่วนเท่าแล้วแต่ไม่ขยายตัวเศษ */
  if(W*L+N2>0)Lc.push({v:[W*L+N2,L],t:'L2'});
  const F=T.reduce((a,t,i)=>a+sg[i]*t.n*(L/t.d),0); /* ผลรวมเฉพาะส่วนเศษส่วน (สเกล L) — ติดลบ = ต้องยืม */
  if(ops.includes('-')&&T[0].w>0&&F<0){
    if(T.length===2)Lc.push({v:[W*L-F,L],t:'L3'});  /* L3 ไม่ยืม เอาตัวมากลบตัวน้อย */
    Lc.push({v:[ans[0]+ans[1],ans[1]],t:'L4'});      /* L4 ยืมแล้วไม่ลดจำนวนเต็ม */
  }
  if(T.some(t=>t.w>0)&&ans[0]>ans[1])Lc.push({v:[ans[0]%ans[1],ans[1]],t:'L4'}); /* L4 ลืมจำนวนเต็ม */
  if(T.length===3){
    const two=T.slice(0,2).reduce((a,t,i)=>a+sg[i]*(t.w*t.d+t.n)*(L/t.d),0);
    oc.push({v:[two,L],t:'P'});                      /* ลืมพจน์ที่สาม */
    if(ops[1]==='-')oc.push({v:[two+(T[2].w*T[2].d+T[2].n)*(L/T[2].d),L],t:'S'}); /* ลบแล้วกลายเป็นบวก */
  }
  return {Lc,oc};
}
/* ตัวลวง L7 (ค่าเท่าคำตอบแต่ไม่ใช่รูปอย่างต่ำ/ไม่เป็นจำนวนคละ) */
function frL7(ans,L){
  const k=L>ans[1]?L/ans[1]:2;
  const unred={v:ans,t:'L7',s:frS(ans[0]*k,ans[1]*k)};
  if(ans[0]>ans[1]&&ri(0,1))return {v:ans,t:'L7',s:frI(ans[0],ans[1])};
  return unred;
}
/* คำอธิบายทีละขั้น */
function frEx(T,ops,sg,L,ans){
  const st=[];let k=1;
  const ds=[...new Set(T.map(t=>t.d))];
  if(ds.length>1)st.push(`ขั้น ${k++} หา ค.ร.น. ของตัวส่วน ${ds.join(' กับ ')} = ${L}`);
  const im=T.map(t=>(t.w*t.d+t.n)*(L/t.d));
  const conv=T.map((t,i)=>{
    if(!t.w&&t.d===L)return null;
    return tS(t)+(t.w?` = ${t.w*t.d+t.n}/${t.d}`:'')+(t.d!==L?` = ${im[i]}/${L}`:'');
  }).filter(Boolean);
  const hasMix=T.some(t=>t.w>0);
  if(conv.length)st.push(`ขั้น ${k++} ${hasMix?'แปลงจำนวนคละเป็นเศษเกิน และ':''}ทำตัวส่วนให้เป็น ${L}: ${conv.join(' , ')}`);
  const N=im.reduce((a,v,i)=>a+sg[i]*v,0);
  const word=ops.every(x=>x==='+')?'บวก':ops.every(x=>x==='-')?'ลบ':'บวกลบ';
  st.push(`ขั้น ${k++} ${word}ตัวเศษ (ตัวส่วนคงเดิม): ${im.map((v,i)=>(i?(sg[i]>0?' + ':' − '):'')+v).join('')} = ${N} → ได้ ${N}/${L}`);
  const g=gcd(N,L);
  if(g>1)st.push(`ขั้น ${k++} ทอนเป็นอย่างต่ำ (หารด้วย ห.ร.ม. ${g}): ${N}/${L} = ${N/g}/${L/g}`);
  if(ans[0]>ans[1])st.push(`ขั้น ${k++} เกินหนึ่งจึงเขียนเป็นจำนวนคละ: ${ans[0]}/${ans[1]} = ${frS(ans[0],ans[1])}`);
  /* วิธียืม (ลบสองพจน์ที่ส่วนเศษส่วนไม่พอลบ) */
  if(T.length===2&&ops[0]==='-'&&T[0].w>0){
    const a1=T[0].n*(L/T[0].d),b1=T[1].n*(L/T[1].d);
    if(a1<b1){
      const w=T[0].w-1-T[1].w,fr=`${a1+L-b1}/${L}`;
      const left=T[1].w?`(${T[0].w-1} − ${T[1].w}) + (${a1+L}/${L} − ${b1}/${L})`
        :T[0].w>1?`${T[0].w-1} + ${a1+L}/${L} − ${b1}/${L}`:`${a1+L}/${L} − ${b1}/${L}`;
      const mid=w?`${w} + ${fr}`:fr,fin=frA(ans[0],ans[1]);
      st.push(`หรือคิดแบบยืม: ${a1}/${L} น้อยกว่า ${b1}/${L} จึงยืมหนึ่งจาก ${T[0].w} มาเป็น ${L}/${L} → ${left} = ${mid}${mid===fin?"":" = "+fin}`);
    }
  }
  return st.join(' • ');
}
/* ประกอบโจทย์บวก/ลบหลายพจน์ — คืน null ถ้าตัวเลขไม่เข้ากติกา (ให้สุ่มใหม่) */
function frBuild(T,ops,lv,sec,o={}){
  if(T.some(t=>t.d<2||t.d>24))return null;
  const L=T.reduce((a,t)=>lcm(a,t.d),1);
  if(L>LCAP[lv])return null;
  const sg=[1,...ops.map(x=>x==='+'?1:-1)];
  let run=0;
  for(let i=0;i<T.length;i++){run+=sg[i]*(T[i].w*T[i].d+T[i].n)*(L/T[i].d);if(run<=0)return null;} /* ทุกขั้นต้องเป็นบวก */
  if(run%L===0)return null;                                 /* ผลต้องไม่เป็นจำนวนเต็มพอดี */
  const ans=frR(run,L);
  const {Lc,oc}=frLures(T,ops,sg,ans,L);
  const Ls=shuffle(Lc);
  const cands=lv===3?[Ls[0],frL7(ans,L),...Ls.slice(1),...shuffle(oc)]:[...Ls,...shuffle(oc)];
  const r=mcFrac(ans,cands,{unit:o.unit});
  if(!r)return null;
  const note=lv===3?(ans[0]>ans[1]?' (ตอบเป็นเศษส่วนอย่างต่ำ ถ้าเกินหนึ่งให้ตอบเป็นจำนวนคละ)':' (ตอบเป็นเศษส่วนอย่างต่ำ)'):'';
  const expr=T.map((t,i)=>(i?(sg[i]>0?' + ':' − '):'')+tS(t)).join('');
  const ex=frEx(T,ops,sg,L,ans);
  return {sec,q:(o.q||`${expr} มีค่าเท่าไร`)+note,fr:true,
    choices:r.choices,correct:r.correct,lures:r.lures,
    sig:`9${o.k}|${o.kind?o.kind+'|':''}${ops.join('')}|${T.map(t=>t.w+'.'+t.n+'.'+t.d).join('|')}`,
    ex:(o.cue?o.cue+' • ':'')+ex+(o.unit?` • ตอบ ${frS(ans[0],ans[1])} ${o.unit}`:'')};
}
/* สุ่มตัวส่วนสองตัวตามระดับ: 1=ตัวหนึ่งเป็นพหุคูณของอีกตัว 2=ไม่มีตัวประกอบร่วม 3=ค.ร.น. ใหญ่ (37–90) */
function frPair(lv){
  for(;;){
    let d1,d2;
    if(lv===1){d1=ri(2,8);d2=d1*ri(2,3);if(d2>24)continue;if(ri(0,1))[d1,d2]=[d2,d1];return [d1,d2];}
    if(lv===2){d1=ri(2,12);d2=ri(2,12);if(d1!==d2&&gcd(d1,d2)===1&&d1*d2<=60)return [d1,d2];continue;}
    d1=ri(4,24);d2=ri(4,24);const L=lcm(d1,d2);
    if(gcd(d1,d2)>1&&d1%d2!==0&&d2%d1!==0&&L>36&&L<=90)return [d1,d2];
  }
}

function f9_simp(lv){
  for(;;){
    const b=ri(2,lv===1?10:12),kmin=lv===1?2:3,kmax=Math.floor(24/b);
    if(kmax<kmin)continue;
    const a=rProper(b),k=ri(kmin,kmax);
    const n=a*k,d=b*k;
    /* L6 ทอนผิด: หารตัวเศษกับตัวส่วนด้วยคนละจำนวน */
    const divs=x=>{const r=[];for(let i=2;i<x;i++)if(x%i===0&&i!==k)r.push(i);return r;};
    const hd=divs(d),hn=divs(n),cands=[];
    if(hd.length){const h=pick(hd);cands.push({v:[a,d/h],t:'L6'});}
    if(hn.length){const h=pick(hn);cands.push({v:[n/h,b],t:'L6'});}
    const r=mcFrac([a,b],shuffle(cands),{proper:true});
    if(!r)continue;
    return {sec:'ทำเป็นอย่างต่ำ',q:`ทำ ${n}/${d} ให้เป็นเศษส่วนอย่างต่ำ ได้เท่าไร`,fr:true,
      choices:r.choices,correct:r.correct,lures:r.lures,sig:`9s|${n}|${d}`,
      ex:`ขั้น 1 หา ห.ร.ม. ของ ${n} กับ ${d} ได้ ${k} • ขั้น 2 หารทั้งตัวเศษและตัวส่วนด้วย ${k}: ${n} ÷ ${k} = ${a} , ${d} ÷ ${k} = ${b} → ได้ ${a}/${b} • ทอนต่อไม่ได้แล้ว จึงเป็นอย่างต่ำ (ต้องหารบนและล่างด้วยจำนวนเดียวกันเสมอ)`};
  }
}
function f9_mixed(){

      const fi=(x,y)=>{const r=frR(x,y);return frI(r[0],r[1]);};
      const r=mcFrac([N,d],shuffle([{v:[w+n,d],t:'L4'},{v:[w*n+d,d],t:'L4'},{v:[w*d-n,d],t:'L4'}]),{fmt:fi,ansS:frI(N,d)});
      if(!r)continue;
      return {sec:'จำนวนคละ ↔ เศษเกิน',q:`เขียน ${w} ${n}/${d} เป็นเศษเกิน ได้เท่าไร`,fr:true,

        ex:`จำนวนเต็ม × ตัวส่วน + ตัวเศษ: ${w} × ${d} + ${n} = ${N} → ได้ ${N}/${d} (ตัวส่วนเท่าเดิม)`};
    }

    if(w<d&&n!==w)c.push({v:[n*d+w,d],t:'L4'});      /* สลับผลหารกับเศษ */
    const r=mcFrac([N,d],shuffle(c));
    if(!r)continue;
    return {sec:'จำนวนคละ ↔ เศษเกิน',q:`เขียน ${N}/${d} เป็นจำนวนคละ ได้เท่าไร`,fr:true,

  }
}
function f9_lcd(lv){
  for(;;){
    const d1=ri(2,18),d2=ri(d1+1,24);
    if(gcd(d1,d2)===1||d2%d1===0)continue;
    const L=lcm(d1,d2);if(L>LCAP[lv])continue;
    const n1=rProper(d1),n2=rProper(d2);
    const vals=[L],tags=['ANS'];
    const add=(v,t)=>{if(v>1&&!vals.includes(v)){vals.push(v);tags.push(t);}};
    add(d1*d2,'L5');                                 /* L5 ใช้ผลคูณแทน ค.ร.น. */
    for(const [v,t] of shuffle([[L*2,'M'],[gcd(d1,d2),'G'],[d1+d2,'S']]))if(vals.length<4)add(v,t);
    for(let m=3;vals.length<4;m++)add(L*m,'M');
    const ord=shuffle([0,1,2,3]);
    const mult=[];for(let x=d2;x<=L;x+=d2)mult.push(x);
    return {sec:'ส่วนร่วมน้อยที่สุด',
      q:`จะหาผลบวก ${n1}/${d1} + ${n2}/${d2} ต้องทำตัวส่วนให้เท่ากันก่อน ตัวส่วนที่น้อยที่สุดที่ใช้ได้ (ค.ร.น. ของ ${d1} กับ ${d2}) คือเท่าไร`,fr:true,
      choices:ord.map(i=>String(vals[i])),correct:ord.indexOf(0),lures:ord.map(i=>tags[i]),sig:`9l|${d1}|${d2}|${n1}|${n2}`,
      ex:`ไล่พหุคูณของ ${d2}: ${mult.join(', ')} → ตัวแรกที่ ${d1} หารลงตัวคือ ${L} • ใช้ ${d1} × ${d2} = ${d1*d2} ก็ทำส่วนให้เท่ากันได้ แต่ไม่ใช่ตัวที่น้อยที่สุด ตัวเลขจะใหญ่และต้องทอนทีหลัง`};
  }
}

function f9_sub2(lv){

      const [d1,d2]=frPair(1);

      if(T[0].n*T[1].d<=T[1].n*T[0].d)continue;
    }else{                                           /* จำนวนคละ มีการยืม */
      const top=lv===3?24:12,d1=ri(2,top),d2=ri(2,top);

      const w1=lv===3?ri(2,5):ri(1,4),w2=lv===3&&ri(0,1)?ri(1,w1-1):0;
      T=[tm(w1,d1),tm(w2,d2)];
      if(T[0].n*T[1].d>=T[1].n*T[0].d)continue;
    }
    const r=frBuild(T,['-'],lv,'ลบเศษส่วน / จำนวนคละ',{k:'b'});
    if(r)return r;
  }
}
function f9_three(lv){
  const D=lv===3?[2,3,4,5,6,8,9,10,12,15,18,20,24]:[2,3,4,5,6,8,10,12,15,20];

    const minus=ri(0,1)===1;

    const r=frBuild(T,minus?['-','-']:['+','+'],lv,'บวกลบสามพจน์',{k:'t'});
    if(r)return r;
  }
}

function svgGrid100(n){
  let cells='';
  for(let i=0;i<100;i++){
    const cx=6+(i%10)*13, cy=6+Math.floor(i/10)*13;
    cells+=`<rect x="${cx}" y="${cy}" width="12" height="12" fill="${i<n?'#60a5fa':'#eef2f7'}" stroke="#cbd5e1" stroke-width="0.6"/>`;
  }
  return `<svg width="142" height="142" viewBox="0 0 142 142">${cells}</svg>`;
}

/* แถบเศษส่วน (บทที่ 9): rows=[[ตัวเศษ,ตัวส่วน,สี]] • ops=เครื่องหมายหน้าแต่ละแถว */
function svgFracBars(rows,ops){
  const W=210,H=24,G=12,x0=26;
  let s='';
  rows.forEach((r,i)=>{
    const n=r[0],d=r[1],c=r[2],y=8+i*(H+G),w=W/d;
    for(let j=0;j<d;j++)s+=`<rect x="${(x0+j*w).toFixed(2)}" y="${y}" width="${w.toFixed(2)}" height="${H}" fill="${j<n?c:'#f1f5f9'}" stroke="#64748b" stroke-width="1"/>`;
    if(ops&&ops[i])s+=`<text x="${x0/2}" y="${y+H/2+6}" text-anchor="middle" font-size="18" font-weight="bold" fill="#39418a">${ops[i]}</text>`;
    const lx=x0+W+24;
    s+=`<text x="${lx}" y="${y+10}" text-anchor="middle" font-size="12" font-weight="bold" fill="#39418a">${n}</text><line x1="${lx-9}" y1="${y+13}" x2="${lx+9}" y2="${y+13}" stroke="#39418a" stroke-width="1.3"/><text x="${lx}" y="${y+25}" text-anchor="middle" font-size="12" font-weight="bold" fill="#39418a">${d}</text>`;
  });
  const h=8+rows.length*(H+G),wd=x0+W+48;
  return `<svg class="frbar" width="${wd}" height="${h}" viewBox="0 0 ${wd} ${h}" style="max-width:100%">${s}</svg>`;
}

 {t:'รู้จักสี่เหลี่ยมทั้ง 6 ชนิด (ดูรูปกันเลย!)',h:`

   <div>${svgShape('ด้านขนาน')}<b>ด้านขนาน</b><small>ขนานกัน 2 คู่ มุมไม่ฉาก</small></div>

  </div>
  <div class="tipbox">💡 รูปสองรูปที่ฐานเท่ากัน และอยู่ระหว่างเส้นขนานคู่เดียวกัน จะสูงเท่ากันเสมอ → <b>พื้นที่เท่ากัน</b> แม้เอียงไม่เหมือนกัน</div>`},
 {t:'ลองทำดูเอง! ✏️',h:`

  <div class="trybox"><b>ข้อ 1)</b> สี่เหลี่ยมด้านขนาน ฐาน 9 ซม. สูง 4 ซม. มีพื้นที่เท่าไร?
   <details><summary>👀 กดดูเฉลย</summary><div class="tans">9 × 4 = <b>36 ตารางเซนติเมตร</b></div></details></div>

   <details><summary>👀 กดดูเฉลย</summary><div class="tans">สูง = พื้นที่ ÷ ฐาน = 42 ÷ 7 = <b>6 ซม.</b></div></details></div>
  <div class="trybox"><b>ข้อ 3)</b> ฐาน 10 ซม. ด้านเอียง 6 ซม. ส่วนสูง 5 ซม. พื้นที่เท่าไร?

5:[
 {t:'สามเหลี่ยม = ครึ่งหนึ่งของสี่เหลี่ยม',h:`
  <p>ลากเส้นทแยงมุมในสี่เหลี่ยม จะได้สามเหลี่ยม 2 รูปที่เท่ากันพอดี ดังนั้น...</p>
  <div style="text-align:center">${svgHalfRect()}</div>

 {t:'ลองคำนวณกัน',h:`
  <div style="text-align:center">${svgTri('8 ซม.','3 ซม.','',false)}</div>
  <div class="exbox">พื้นที่ = (8 × 3) ÷ 2 = 24 ÷ 2 = <b>12 ตารางเซนติเมตร</b></div>
  <div class="tipbox">⚠️ <b>อย่าลืม ÷2!</b> ถ้าคำตอบออกมา 24 แสดงว่าลืมหารสอง — ข้อสอบดักตรงนี้บ่อยที่สุด</div>`},
 {t:'ถ้าหารสองแล้วไม่ลงตัว?',h:`

  <div class="exbox">ฐาน 9 ซม. สูง 7 ซม.<br>พื้นที่ = (9 × 7) ÷ 2 = 63 ÷ 2 = <b>31.5 ตารางเซนติเมตร</b></div>
  <div class="tipbox">💡 ทางลัด: ถ้าฐานหรือสูงเป็น<b>เลขคู่</b> หารสองก่อนแล้วค่อยคูณ ง่ายกว่าเยอะ!<br>เช่น ฐาน 8 สูง 7 → (8 ÷ 2) × 7 = 4 × 7 = 28 คิดในใจได้เลย</div>`},
 {t:'เลือกคู่ให้ถูก + ส่วนสูงนอกรูป',h:`
  <p>ถ้าโจทย์ให้ตัวเลขหลายตัว เลือกเฉพาะ<b>คู่ที่ตั้งฉากกัน</b><br>เช่น มีด้าน 13, ฐาน 7 และสูง 6 → ใช้ (7 × 6) ÷ 2 = <b>21</b> ห้ามหยิบ 13 มาคูณ!</p>

 {t:'สามเหลี่ยมมุมฉาก + โจทย์ปัญหา',h:`
  <p>สามเหลี่ยมมุมฉากคิดง่ายที่สุด: <b>ด้านประกอบมุมฉาก 2 ด้าน</b> คือฐานกับสูงพอดีเลย</p>
  <div class="exbox">ด้านประกอบมุมฉากยาว 6 และ 8 ซม. ด้านเอียงยาว 10 ซม.<br>พื้นที่ = (6 × 8) ÷ 2 = <b>24 ตร.ซม.</b> — เลข 10 ไม่ต้องใช้!</div>
  <div class="exbox">ทำธงรูปสามเหลี่ยม ฐาน 40 ซม. สูง 25 ซม. จำนวน 6 ผืน ใช้ผ้าทั้งหมดเท่าไร?<br><b>ขั้น 1</b> ผืนละ (40 × 25) ÷ 2 = 500 ตร.ซม.<br><b>ขั้น 2</b> 6 ผืน: 500 × 6 = <b>3,000 ตร.ซม.</b></div>`},
 {t:'โจทย์ย้อนกลับ + รูปหลายเหลี่ยม',h:`
  <div class="exbox">สามเหลี่ยมพื้นที่ 24 ตร.ซม. ฐานยาว 10 ซม. สูงเท่าไร?<br><b>ขั้น 1</b> พื้นที่ × 2 = 24 × 2 = 48<br><b>ขั้น 2</b> 48 ÷ ฐาน = 48 ÷ 10 = <b>4.8 ซม.</b></div>
  <div class="bigf">สูง = พื้นที่ × 2 ÷ ฐาน</div>
  <div class="tipbox">💡 รูปหลายเหลี่ยมใหญ่ๆ ก็ไม่ยาก: แบ่งเป็นสามเหลี่ยมหลายรูป หาพื้นที่ทีละรูป แล้วบวกรวมกัน</div>`},
 {t:'ลองทำดูเอง! ✏️',h:`
  <p>อย่าลืมสูตร ฐาน × สูง ÷ 2 นะ</p>
  <div class="trybox"><b>ข้อ 1)</b> สามเหลี่ยมฐาน 10 ซม. สูง 6 ซม. พื้นที่เท่าไร?
   <details><summary>👀 กดดูเฉลย</summary><div class="tans">(10 × 6) ÷ 2 = 60 ÷ 2 = <b>30 ตร.ซม.</b></div></details></div>
  <div class="trybox"><b>ข้อ 2)</b> สามเหลี่ยมฐาน 5 ซม. สูง 7 ซม. พื้นที่เท่าไร?
   <details><summary>👀 กดดูเฉลย</summary><div class="tans">(5 × 7) ÷ 2 = 35 ÷ 2 = <b>17.5 ตร.ซม.</b> (เป็นทศนิยมได้ ไม่ผิด!)</div></details></div>
  <div class="trybox"><b>ข้อ 3)</b> สามเหลี่ยมพื้นที่ 36 ตร.ซม. ฐาน 8 ซม. สูงเท่าไร?
   <details><summary>👀 กดดูเฉลย</summary><div class="tans">สูง = พื้นที่ × 2 ÷ ฐาน = 36 × 2 ÷ 8 = 72 ÷ 8 = <b>9 ซม.</b></div></details></div>`},
],

 {t:'คูณทศนิยม 3 ขั้นตอน',h:`
  <div class="exbox"><b>ขั้น 1</b> คูณแบบไม่สนใจจุดก่อน: 23 × 18 = 414<br><b>ขั้น 2</b> นับตำแหน่งทศนิยมรวมกัน: 2.3 มี 1 + 1.8 มี 1 = <b>2 ตำแหน่ง</b><br><b>ขั้น 3</b> ใส่จุดให้ครบ 2 ตำแหน่ง → <b>4.14</b></div>

 {t:'คูณจำนวนเต็ม + เช็คด้วยการประมาณ',h:`

  <div class="tipbox">💡 ประมาณคร่าวๆ ก่อนตอบทุกครั้ง = เกราะกันตอบผิดเป็น 10 เท่า</div>`},
 {t:'หารทศนิยมด้วยจำนวนเต็ม',h:`

  <div class="bigf">27.78 ÷ 6 = 4.63</div>
  <div class="exbox">เช็คย้อนกลับ: 4.63 × 6 = 27.78 ✓ ถูกต้อง!</div>
  <div class="tipbox">💡 เช็คคำตอบด้วยการคูณย้อนกลับทุกครั้ง จะไม่พลาดเลย</div>`},
 {t:'หารยาวทีละขั้น ดูชัดๆ',h:`

37 ÷ 6 = 6 เศษ 1  → เขียน 6
18 ÷ 6 = 3 พอดี   → เขียน 3

27.78 ÷ 6 = 4.63</div></div>
  <div class="exbox">เศษที่เหลือเอาไปต่อหน้าเลขตัวถัดไป:<br>เศษ 3 ต่อกับ 7 → กลายเป็น 37 • เศษ 1 ต่อกับ 8 → กลายเป็น 18</div>
  <div class="tipbox">💡 จุดของคำตอบตรงกับจุดของตัวตั้งเป๊ะ — พอหารผ่านจุดปุ๊บ ใส่จุดปั๊บ</div>`},
 {t:'ทศนิยมหารทศนิยม',h:`
  <p>เคล็ดลับ: ทำ<b>ตัวหาร</b>ให้เป็นจำนวนเต็มก่อน โดยเลื่อนจุดของ<b>ทั้งคู่</b>เท่าๆ กัน</p>
  <div class="exbox">3.36 ÷ 0.3 → เลื่อนจุดขวา 1 ตำแหน่งทั้งคู่ → 33.6 ÷ 3 = <b>11.2</b><br>10.032 ÷ 1.2 → 100.32 ÷ 12 = <b>8.36</b></div>
  <div class="tipbox">💡 เลื่อนจุดพร้อมกันทั้งตัวตั้งและตัวหาร คำตอบไม่เปลี่ยน (เหมือนคูณ 10 ทั้งเศษและส่วน)</div>`},
 {t:'ลองทำดูเอง! ✏️',h:`
  <p>นับตำแหน่งจุดดีๆ นะ</p>

  <div class="trybox"><b>ข้อ 2)</b> 5.48 ÷ 4 = ?
   <details><summary>👀 กดดูเฉลย</summary><div class="tans">548 ÷ 4 = 137 → จุดตรงกับตัวตั้ง → <b>1.37</b> (เช็ค: 1.37 × 4 = 5.48 ✓)</div></details></div>
  <div class="trybox"><b>ข้อ 3)</b> 7.2 ÷ 0.9 = ?
   <details><summary>👀 กดดูเฉลย</summary><div class="tans">เลื่อนจุดขวา 1 ทั้งคู่ → 72 ÷ 9 = <b>8</b></div></details></div>`},
],
7:[
 {t:'ลำดับการคำนวณ (สำคัญมาก!)',h:`
  <div class="bigf">① วงเล็บ ( ) → ② คูณ × หาร ÷ → ③ บวก + ลบ −</div>
  <p>ถ้าอยู่ขั้นเดียวกัน ทำจาก<b>ซ้ายไปขวา</b></p>
  <div class="exbox">(16.50 + 14.75) ÷ 6.25<br><b>ขั้น 1</b> ทำในวงเล็บก่อน: 16.50 + 14.75 = 31.25<br><b>ขั้น 2</b> 31.25 ÷ 6.25 = <b>5</b></div>
  <div class="tipbox">⚠️ ถ้าไม่ทำวงเล็บก่อน คำตอบผิดทันที!</div>`},
 {t:'ไม่มีวงเล็บ? คูณหารก่อนเสมอ',h:`
  <div class="exbox">8.4 − 2 × 3.1 = ?<br><b>ผิด ✗:</b> 8.4 − 2 = 6.4 แล้วคูณ 3.1 ได้ 19.84 ← ทำซ้ายไปขวาเฉยๆ ไม่ได้!<br><b>ถูก ✓:</b> คูณก่อน 2 × 3.1 = 6.2 แล้วค่อยลบ 8.4 − 6.2 = <b>2.2</b></div>
  <div class="exbox">12.6 ÷ 3 + 1.5 × 2 = ?<br><b>ขั้น 1</b> ทำคูณและหารให้หมดก่อน: 12.6 ÷ 3 = 4.2 และ 1.5 × 2 = 3<br><b>ขั้น 2</b> ค่อยบวก: 4.2 + 3 = <b>7.2</b></div>
  <div class="tipbox">⚠️ "ซ้ายไปขวา" ใช้เฉพาะตอนอยู่<b>ขั้นเดียวกัน</b> เช่น มีแต่บวกกับลบ หรือมีแต่คูณกับหาร</div>`},
 {t:'โจทย์สองชั้น ทำทีละขั้น',h:`
  <div class="exbox">"(46.308 ÷ 3.4) + 15.29 มีค่าน้อยกว่า 52.71 อยู่เท่าไร"<br><b>ขั้น 1</b> ในวงเล็บ: 46.308 ÷ 3.4 = 13.62<br><b>ขั้น 2</b> บวกต่อ: 13.62 + 15.29 = 28.91<br><b>ขั้น 3</b> หาส่วนต่าง: 52.71 − 28.91 = <b>23.8</b></div>
  <div class="tipbox">💡 โจทย์ยาวไม่ต้องกลัว หั่นเป็นขั้นเล็กๆ แล้วทำทีละขั้นเท่านั้นเอง</div>`},
 {t:'โจทย์ปัญหาหลายขั้นตอน',h:`
  <p>สูตรอ่านโจทย์ 3 ข้อ: <b>① โจทย์ถามอะไร ② มีข้อมูลอะไรบ้าง ③ วางแผนทีละขั้น</b></p>
  <div class="exbox">ซื้อสบู่ 2 โหลครึ่ง ก้อนละ 12.75 บาท ให้เงิน 1,000 บาท ได้เงินทอนเท่าไร?<br><b>ขั้น 1</b> 2 โหลครึ่ง = 2.5 × 12 = <b>30 ก้อน</b><br><b>ขั้น 2</b> ราคารวม: 30 × 12.75 = 382.50 บาท<br><b>ขั้น 3</b> เงินทอน: 1000 − 382.50 = <b>617.50 บาท</b></div>
  <div class="tipbox">💡 ระวังหน่วยแปลกๆ เช่น "โหล" = 12 ชิ้น "ครึ่งโหล" = 6 ชิ้น</div>`},
 {t:'โจทย์แบ่งของ: หารคือพระเอก',h:`
  <div class="exbox">ริบบิ้นยาว 12.6 เมตร ตัดเป็นเส้นละ 0.9 เมตร ได้กี่เส้น?<br>12.6 ÷ 0.9 → เลื่อนจุดทั้งคู่ → 126 ÷ 9 = <b>14 เส้น</b></div>

 {t:'ลองทำดูเอง! ✏️',h:`

 {t:'ทวนเร็ว: × ÷ 10 100 1000',h:`

 {t:'ลองทำดูเอง! ✏️',h:`

 {t:'ส่วนเท่ากัน บวกลบได้เลย 🍕',h:`

 {t:'จำนวนคละ: แปลงไป-กลับ และการยืม',h:`

 {t:'กับดักที่เจอบ่อย + ลองทำ ✏️',h:`

/* =====================================================================
   (B) ตัวเล่น (player) — ส่วนที่จะยกเข้าเกม (แผน 3.2 + 3.3 บรรทัดแรก + 14.1/14.7)
   ทางออกเรียก lessonExit()/lessonFinish() · บันทึกดูจบเรียก lessonMarkSeen() · บันทึกฉากจบเรียก lessonMarkScene(k)
   — 4 ตัวนี้อยู่ในส่วน (C)
   ===================================================================== */
let LESSON_GEN=0; // เพิ่มขึ้นตลอดอายุหน้า ไม่รีเซ็ตเมื่อปิด/เปิดบทเรียนใหม่
let LA=null;      // สถานะกลางตัวเดียว
const LESSON_MARKS={trap:'❌ แบบนี้ผิด',check:'🔍 ตรวจกลับ',fix:'✅ แบบที่ถูก'};
const LESSON_ROLES={dd:'ตัวตั้ง',dv:'ตัวหาร',res:'ผลคูณ/ผลหาร',rem:'เศษ',dot:'จุดทศนิยม',bad:'ผิด'};
function lessonReduced(){try{return typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches===true;}catch(e){return false;}}
function lessonCount(k){return LESSON6[k].steps?LESSON6[k].steps.length:1;}
function lessonPos(k,j){let p=0;for(let i=0;i<k;i++)p+=lessonCount(i);return p+j;}
function lessonTotal(){return lessonPos(LESSON6.length,0);}
function lessonFinName(html){const m=/data-la-final="(la-[a-z0-9-]+)"/.exec(html);return m?m[1]:null;}
// บทบาทสีที่ขั้นใช้ (ภาพ + คำบรรยาย) · legend แสดงเฉพาะบทบาทที่ใช้ครั้งแรกของฉาก (ก่อนตัวภาพ)
function lessonRolesOf(st){if(st.kind==='quiz')return [];const s=new Set();for(const m of (st.draw()+st.say).matchAll(/data-role="([a-z]+)"/g))s.add(m[1]);return [...s];}
function lessonLegend(k,j){const sc=LESSON6[k],seen=new Set();for(let i=0;i<j;i++)lessonRolesOf(sc.steps[i]).forEach(r=>seen.add(r));
  const nw=lessonRolesOf(sc.steps[j]).filter(r=>!seen.has(r)&&LESSON_ROLES[r]);
  return nw.length?`<div class="la-lg">สี: ${nw.map(r=>`<span class="la-lgc" data-role="${r}">● ${LESSON_ROLES[r]}</span>`).join('')}</div>`:'';}
function lessonCleanup(){
  if(!LA)return;
  if(LA.timer!==null){clearTimeout(LA.timer);LA.timer=null;}
  if(LA.off){LA.off();LA.off=null;}
}
// ขั้นจบ: ครั้งเดียวต่อ gen · gen ไม่ตรง หรือ #la-root หลุดจาก DOM แล้ว = ไม่ทำอะไร
function stepDone(gen,why){
  if(!LA||gen!==LA.gen||LA.done)return false;
  const root=LA.root;
  if(!root||!root.isConnected)return false;
  LA.done=true;LA.why=why;
  lessonCleanup();
  const pos=lessonPos(LA.scene,LA.step);
  if(pos>LA.unlocked)LA.unlocked=pos;
  const sc=LESSON6[LA.scene];
  if(sc.steps&&LA.step===sc.steps.length-1&&!LA.sdone[LA.scene]){LA.sdone[LA.scene]=true;lessonMarkScene(LA.scene);} // จบฉาก = ผ่านขั้นสุดท้าย
  const b=document.getElementById('la-next');
  if(b)b.disabled=false;
  return true;
}
// ฉากแรกที่ยังไม่จบ (ก่อนดูจบ: ไปได้ถึงฉากนี้ · หลังดูจบ: ไปได้ทุกฉาก)
function lessonFrontier(){if(!LA.forced)return LESSON6.length-1;let k=0;while(k<LESSON6.length-1&&LA.sdone[k])k++;return k;}
// เปิดบทเรียน: forced = ยังไม่เคยดูจบ · prog = ฉากที่จบแล้ว (array ของ true) → เริ่มที่ขั้นแรกของฉากแรกที่ยังไม่จบ
function lessonStart(forced,lv,uid,prog){
  lessonCleanup();
  const sd=[];for(let k=0;k<LESSON6.length-1;k++)sd[k]=forced?!!(prog&&prog[k]):true;
  LA={ch:6,scene:0,step:0,gen:0,done:false,timer:null,forced:!!forced,lv:lv==null?null:lv,uid:uid==null?null:uid,
      unlocked:forced?-1:lessonTotal()-1,root:null,off:null,why:'',sdone:sd,qa:{},pick:null};
  if(LA.forced){const fr=lessonFrontier();LA.scene=fr;LA.unlocked=lessonPos(fr,0)-1;}
  lessonRender('play');
}
// แถบแผนที่ฉาก: ✓ = จบแล้ว · ฉากที่ยังไม่ถึงกดไม่ได้
function lessonMapBar(){
  if(!LA)return '';
  const fr=lessonFrontier();
  return `<div class="la-map">${LESSON6.map((s,k)=>{const dn=k<LESSON6.length-1&&LA.sdone[k];
    return `<button class="la-mb${dn?' la-done':''}${k===LA.scene?' la-on':''}" onclick="lessonJump(${k})"${k>fr?' disabled':''}>${k+1}${dn?' ✓':''}</button>`;}).join('')}</div>`;
}
function lessonQuizHtml(st,solved,pick){
  let fb='';
  if(solved){const c=st.choices.find(c=>c.correct);fb=`<div class="la-qfb la-qok">✅ ถูกต้อง! ${c.why}</div>`;}
  else if(pick!=null&&st.choices[pick])fb=`<div class="la-qfb la-qno">❌ ยังไม่ใช่ · ${st.choices[pick].why}</div><button class="la-ctl la-qretry" onclick="lessonRetry()">↺ ลองอีกครั้ง</button>`;
  const lock=solved||pick!=null;
  return `<div class="la-qq">${st.q}</div><div class="la-qcs">${st.choices.map((c,i)=>`<button class="la-qc${solved&&c.correct?' la-qok':''}${!solved&&pick===i?' la-qno':''}" onclick="lessonAnswer(${i})"${lock?' disabled':''}>${c.text}</button>`).join('')}</div>${fb}`;
}
// mode: 'play' = เล่นอนิเมชั่น · 'still' = แสดงสภาพจบทันที (ใช้ตอน ◀ ย้อน / ตอบคำถาม) · keep = ไม่เลื่อนขึ้นบนสุด
function lessonRender(mode,keep){
  if(!LA)return;
  lessonCleanup();
  const gen=LA.gen=++LESSON_GEN;
  LA.done=false;LA.why='';LA.root=null;
  const app=document.getElementById('app');
  const sc=LESSON6[LA.scene],n=LESSON6.length,pos=lessonPos(LA.scene,LA.step),tot=lessonTotal();
  const top=`<div class="topbar"><span class="pill">บทที่ 6</span><span class="pill">📖 ฉาก ${LA.scene+1}/${n}${sc.steps?` · ขั้น ${LA.step+1}/${sc.steps.length}`:''}</span><button class="exit" onclick="lessonExit()">ออก</button></div>
  <div class="bar"><div style="width:${Math.round((pos+1)/tot*100)}%"></div></div>${lessonMapBar()}`;
  const head=`<div class="card"><span class="qsec">📖 บทเรียน · ฉาก ${LA.scene+1}</span><div class="qtext">${sc.t}</div>`;
  if(!sc.steps){ // หน้า "ลองทำดูเอง" (ฉากสุดท้าย)
    const reached=LA.unlocked>=pos-1;
    if(reached){if(pos>LA.unlocked)LA.unlocked=pos;LA.forced=false;}
    app.innerHTML=top+head+`
    <div id="la-root" class="la-root la-still"><div class="lesson">${sc.h}</div></div>
    <div class="btnrow"><button class="nextbtn ghost" onclick="lessonPrev()">◀ ย้อน</button><button class="nextbtn alt" onclick="lessonFinish()">${lessonFinishLabel()}</button></div></div>`;
    LA.root=document.getElementById('la-root');
    if(typeof scrollTo==='function')scrollTo(0,0);
    if(reached)lessonMarkSeen();
    stepDone(gen,'static');
    return;
  }
  const st=sc.steps[LA.step],last=LA.step===sc.steps.length-1;
  const ctrls=`<div class="la-ctrls"><button class="la-ctl" onclick="lessonPrev()"${pos===0?' disabled':''}>◀ ย้อน</button><button class="la-ctl" onclick="lessonReplay()">↻ เล่นซ้ำ</button></div>
    <button id="la-next" class="nextbtn la-next" style="display:block" onclick="lessonNext()" disabled>ถัดไป ▶</button></div>`;
  if(st.kind==='quiz'){ // ขั้นคำถาม: ไม่มีอนิเมชั่น/ตัวจบ · ปลดเมื่อตอบถูกเท่านั้น
    const solved=!!LA.qa[LA.scene+':'+LA.step];
    app.innerHTML=top+head+`<div class="la-mark la-m-quiz">❓ ลองตอบดู</div><div id="la-root" class="la-root la-still">${lessonQuizHtml(st,solved,LA.pick)}</div>`+ctrls;
    LA.root=document.getElementById('la-root');
    if(!keep&&typeof scrollTo==='function')scrollTo(0,0);
    if(solved)stepDone(gen,'answered');
    return;
  }
  const body=st.draw(),fin=lessonFinName(body);
  const rm=lessonReduced(),still=mode==='still'||rm;
  const badge=LESSON_MARKS[st.mark]?`<div class="la-mark la-m-${st.mark}">${LESSON_MARKS[st.mark]}</div>`:st.kind==='why'?'<div class="la-mark la-m-why">💡 ทำไม</div>':'';
  const say=`<div class="lesson la-say">${st.say}</div>`; // การ์ดสรุป: หัว "จำ 3 ข้อ" อยู่เหนือการ์ด
  app.innerHTML=top+head+`${badge}${lessonLegend(LA.scene,LA.step)}${st.kind==='sum'?say:''}<div id="la-root" class="la-root${still?' la-still':''}${/\bla-focus\b/.test(body)?' la-fz':''}">${body}</div>
    ${st.kind!=='sum'?say:''}
    ${last&&st.kind!=='sum'?`<div class="tipbox">📌 <b>สรุปฉากนี้:</b> ${sc.sum}</div>`:''}`+ctrls;
  const root=LA.root=document.getElementById('la-root');
  if(!keep&&typeof scrollTo==='function')scrollTo(0,0);
  if(still){stepDone(gen,rm?'reduced':'still');return;}
  if(!LA.forced&&pos<=LA.unlocked){stepDone(gen,'passed');return;} // ดูจบบทแล้ว: เล่นให้ดูแต่ไม่ล็อกปุ่ม · ระหว่างดูครั้งแรก เล่นภาพใหม่เมื่อไรต้องรอจบเสมอ
  const h=function(e){
    if(!e||!fin||e.animationName!==fin)return;
    const t=e.target;
    if(!t||typeof t.getAttribute!=='function'||t.getAttribute('data-la-final')===null)return;
    stepDone(gen,'event');
  };
  root.addEventListener('animationend',h);
  LA.off=function(){root.removeEventListener('animationend',h);};
  LA.timer=setTimeout(function(){stepDone(gen,'fallback');},st.ms+600);
}
function lessonNext(){
  if(!LA||!LA.done)return; // ขั้นปัจจุบันยังไม่จบ/ยังไม่ตอบถูก = ไปต่อไม่ได้
  const sc=LESSON6[LA.scene];
  if(sc.steps&&LA.step<sc.steps.length-1)LA.step++;
  else if(LA.scene<LESSON6.length-1){LA.scene++;LA.step=0;}
  else return;
  LA.pick=null;
  lessonRender('play');
}
function lessonPrev(){
  if(!LA)return;
  if(LA.step>0)LA.step--;
  else if(LA.scene>0){LA.scene--;LA.step=lessonCount(LA.scene)-1;}
  else return;
  LA.pick=null;
  lessonRender('still');
}
// ↻ เล่นซ้ำ · บนขั้นคำถาม = ล้างคำตอบ (ต้องตอบใหม่)
function lessonReplay(){
  if(!LA||!LESSON6[LA.scene].steps)return;
  const st=LESSON6[LA.scene].steps[LA.step];
  if(st.kind==='quiz'){delete LA.qa[LA.scene+':'+LA.step];LA.pick=null;lessonRender('still');return;}
  lessonRender('play');
}
// กระโดดฉาก: ไปได้ถึงฉากแรกที่ยังไม่จบ (ก่อนดูจบ) · ทุกฉาก (หลังดูจบ)
function lessonJump(k){
  if(!LA)return;
  k=+k;if(!(k>=0&&k<LESSON6.length))return;
  if(k>lessonFrontier())return;
  LA.scene=k;LA.step=0;LA.pick=null;lessonRender('play');
}
// ตอบคำถาม: ถูก → จำไว้ในสถานะหน้า + ปลดปุ่มถัดไป · ผิด → แสดงเหตุผล + ปุ่มลองอีกครั้ง (ไม่ไปต่อ) · ไม่นับคะแนน ไม่บันทึก
function lessonAnswer(i){
  if(!LA)return false;
  const sc=LESSON6[LA.scene],st=sc.steps&&sc.steps[LA.step];
  if(!st||st.kind!=='quiz')return false;
  const key=LA.scene+':'+LA.step;
  if(LA.qa[key]||LA.pick!=null)return false;
  i=+i;const c=st.choices[i];if(!c)return false;
  if(c.correct){LA.qa[key]=true;LA.pick=null;lessonRender('still',true);return true;}
  LA.pick=i;lessonRender('still',true);return false;
}
function lessonRetry(){
  if(!LA||LA.pick==null)return;
  LA.pick=null;lessonRender('still',true);
}

/* =====================================================================
   (G) ส่วนเชื่อมเกม — index.html (ใช้คนเดียว · uid='local') ตามแผน 17.2 + 15.3 · แทนส่วน (C) ของหน้าทดลอง
   ตอนโหลดหน้า: มีแค่การประกาศ + LESSONS[6]=LESSON6 (ไม่มี side effect อื่น)
   คีย์: dq5_lessonseen:v1:local:6 (ค่า = ms ที่ดูจบ) · dq5_lessonprog:v1:local:6 (ค่า −1..4 = ฉากไกลสุดที่จบต่อเนื่อง)
   ===================================================================== */
LESSONS[6]=LESSON6; // แทนสไลด์นิ่งบท 6 ตอนรัน (literal LESSONS ไม่แตะ)
const LESSON_ANIM_CH={6:true};
const LESSON_SEEN_MEM=new Map(); // คีย์เต็ม → true · กัน storage อ่าน/เขียนล้มแล้ววนบังคับในหน้าเดียวกัน
const LESSON_PROG_MEM=new Map(); // คีย์เต็ม → lastCompleted (−1..4) · อ่าน = max(storage ที่อ่านได้, MEM)
function lessonKey(kind){return 'dq5_lesson'+kind+':v1:local:6';}
function lessonStore(){try{return typeof localStorage!=='undefined'&&localStorage?localStorage:null;}catch(e){return null;}}
function lessonSeen(){
  const k=lessonKey('seen');
  if(LESSON_SEEN_MEM.has(k))return true;
  try{const s=lessonStore();return !!s&&s.getItem(k)!==null;}catch(e){return false;}
}
function lessonMarkSeen(){
  const k=lessonKey('seen');
  LESSON_SEEN_MEM.set(k,true);
  try{const s=lessonStore();if(s)s.setItem(k,String(Date.now()));}catch(e){}
}
// ค่าความคืบหน้าใน storage: ต้องตรง /^-?\d+$/ และอยู่ −1..4 · ไม่งั้น/อ่านล้ม → −1 (ไม่ใช้ Number(v)/+v ตรง ๆ)
function lessonProgStored(){
  try{
    const s=lessonStore(),v=s?s.getItem(lessonKey('prog')):null;
    if(typeof v!=='string'||!/^-?\d+$/.test(v))return -1;
    const n=parseInt(v,10);
    return n>=-1&&n<=4?n:-1;
  }catch(e){return -1;}
}
function lessonProgMem(){const k=lessonKey('prog');return LESSON_PROG_MEM.has(k)?LESSON_PROG_MEM.get(k):-1;}
function lessonLoadProg(){
  const last=Math.max(lessonProgStored(),lessonProgMem());
  const p=[];for(let k=0;k<=4;k++)p[k]=k<=last;
  return p;
}
// จบฉาก k: ค่าใหม่ = max(อ่านล่าสุดจาก storage, MEM, k) · เขียน storage เฉพาะเมื่อมากกว่าค่าเดิม (ห้ามถอยหลัง) · เขียนล้ม → MEM
function lessonMarkScene(k){
  if(!(Number.isInteger(k)&&k>=0&&k<=4))return;
  const key=lessonKey('prog'),st=lessonProgStored(),nv=Math.max(st,lessonProgMem(),k);
  LESSON_PROG_MEM.set(key,nv);
  if(nv<=st)return;
  try{const s=lessonStore();if(s)s.setItem(key,String(nv));}catch(e){}
}
function lessonFinishLabel(){
  return LA&&LA.lv!=null?`✏️ เริ่มทำโจทย์ (ระดับ ${LVNAME[LA.lv]})`:'✏️ ไปทำโจทย์เลย! (เริ่มระดับ Basic)';
}
function lessonExit(){lessonCleanup();LA=null;home();}
function lessonFinish(){
  if(!LA||LESSON6[LA.scene].steps)return; // ทำงานเฉพาะหน้าสุดท้าย ("ลองทำดูเอง")
  const lv=LA.lv;
  lessonCleanup();LA=null;
  startQuiz(6,lv||1);
}
// ปุ่มระดับ 🟢🟡🔴 บนหน้าหลัก: บทที่มีบทเรียนอนิเมชั่น + ยังไม่เคยดูจบ → เปิดบทเรียนโหมดบังคับ (จำ lv) · ไม่งั้นเข้ารอบตรง
function startQuizUI(ch,lv){
  if(LESSON_ANIM_CH[ch]&&!lessonSeen()){lessonStart(true,lv,'local',lessonLoadProg());return;}
  startQuiz(ch,lv);
}


/* ================= server API ================= */
const ROOT='https://ycstpsjkpsqoukpvfcxz.supabase.co/functions/v1/quiz';
const IS_PARENT=location.pathname.includes('parent')||new URLSearchParams(location.search).has('parent');
let HIST=[],SIGS=new Set();
async function fetchT(url,opt){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
  try{return await fetch(url,Object.assign({},opt||{},{signal:c.signal}));}finally{clearTimeout(t);}
}

async function apiState(){

}
async function apiSave(rec){

function mapRow(r){
  if(!Array.isArray(r.items)||typeof r.score!=='number'||typeof r.total!=='number')throw new Error('invalid history row');
  const startTs=Date.parse(r.created_at),ts=r.finished_at?Date.parse(r.finished_at):startTs;
  return {id:r.id,cid:r.cid||null,status:r.status||'done',timedOut:r.timed_out===true,startTs,ts,ch:r.chapter,score:r.score,total:r.total,
    secs:r.secs,items:r.items};
}
function sortHist(){HIST.sort((a,b)=>(b.ts||0)-(a.ts||0));}
function saveStatus(msg,hide){const e=document.getElementById('savest');if(!e)return;e.textContent=msg;e.style.display='block';clearTimeout(window._saveHide);if(hide)window._saveHide=setTimeout(()=>e.style.display='none',2000);}

/* ================= quiz engine ================= */
const QN=20;
const CHNAME={1:'บทที่ 1 ทศนิยมเบื้องต้น',2:'บทที่ 2 บวก ลบ ทศนิยม และโจทย์ปัญหา',
  3:'บทที่ 3 คูณ หาร ด้วย 10 100 1000',4:'บทที่ 4 พื้นที่สี่เหลี่ยมด้านขนาน',5:'บทที่ 5 พื้นที่สามเหลี่ยม',
  6:'บทที่ 6 การคูณและหารทศนิยม',7:'บทที่ 7 โจทย์ระคนทศนิยม',
  8:'บทที่ 8 ทบทวนคูณหารจำนวนเต็ม (เตรียมสอบ)',
  9:'บทที่ 9 : บวกลบเศษส่วน'};
const LET=['ก','ข','ค','ง'];
let G=null;

function buildQuiz(ch,lv){
  lv=lv||2;
  let gens;
  if(ch===2){
    if(lv===1)gens=rep(g_add,7).concat(rep(g_sub,7),shuffle(WORDS_EASY.slice()).slice(0,6));
    else if(lv===3)gens=rep(g_cmp2,4).concat(rep(g_miss,5),rep(g_sub,3),WORDS_HARD,WORDS_HARD,WORDS_HARD);
    else gens=CH2_BASE.slice().concat(shuffle(WORDS.slice()).slice(0,7));
  }else gens=LVPOOL[ch][lv].slice();
  shuffle(gens);
  if(gens.length>QN)gens=gens.slice(0,QN);
  const qs=[];const round=new Set();
  for(const g of gens){
    let q,tries=0;
    do{q=g(lv);tries++;}while((SIGS.has(q.sig)||round.has(q.sig))&&tries<300);
    q.lv=lv;round.add(q.sig);qs.push(q);
  }
  return qs;
}
function startQuiz(ch,lv){
  lv=lv||2;
  G={ch,lv,qs:buildQuiz(ch,lv),i:0,score:0,answers:[],t0:Date.now(),secsBase:0,pendingId:null,cid:(globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),startTs:Date.now(),saveQ:Promise.resolve()};
  startTicker();
  renderQ();
}
/* ---------- จับเวลาเหมือนสอบจริง (เวลาสะสม พักแล้วกลับมานับต่อ) ---------- */
function elapsedSecs(){return G.frozenSecs!==undefined?G.frozenSecs:Math.round((Date.now()-G.t0)/1000)+(G.secsBase||0);}
function remainSecs(){return (LVTIME[G.lv]||1800)-elapsedSecs();}
function fmtTime(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function stopTicker(){if(window._qtick){clearInterval(window._qtick);window._qtick=null;}}
function startTicker(){
  stopTicker();
  window._qtick=setInterval(()=>{
    if(!G||!G.qs||G.finished){stopTicker();return;}
    const rm=remainSecs();
    const tp=document.getElementById('tmr');
    if(tp){tp.textContent='⏱ '+fmtTime(rm);if(rm<=120)tp.classList.add('tlow');}
    if(rm<=0){stopTicker();timeUp();}
  },1000);
}
function timeUp(){
  if(!G||G.finished)return;
  stopTicker();
  G.timedOut=true;
  if(G.frozenSecs===undefined)G.frozenSecs=elapsedSecs();
  alert('⏰ หมดเวลาแล้ว! รอบนี้ยังไม่ผ่าน เพราะต้องทำครบ '+QN+' ข้อภายใน '+Math.round((LVTIME[G.lv]||1800)/60)+' นาที ไปดูผลกันเลย');
  finish();
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* แสดงเศษส่วนแบบซ้อนบน-ล่าง (บทที่ 9 — เฉพาะข้อที่มี fr:true) • escape ก่อนเสมอ แล้วจึงแปลง "a/b" และ "w a/b" เป็น HTML
   ข้อที่ไม่มี fr (บทที่ 1–8) ได้ผลเหมือน esc() เดิมทุกตัวอักษร */
function fq(s,fr){
  const h=esc(s);
  if(!fr)return h;
  return h.replace(/(^|[^\d\/])(?:(\d+) )?(\d+)\/(\d+)(?![\d\/])/g,(m,p,w,n,d)=>
    p+(w?`<span class="frw">${w}`:'')+`<span class="fr"><span class="fn">${n}</span><span class="fd">${d}</span></span>`+(w?'</span>':''));
}
function fh(s){return fq(s,true);} /* ใช้ในเนื้อหาบทเรียนบทที่ 9 */
function renderQ(){
  const cur=G.qs[G.i];
  document.getElementById('app').innerHTML=`
  <div class="topbar">
    <span class="pill">${CHNAME[G.ch]}</span>
    <span class="pill">${LVNAME[G.lv]}</span>
    <span class="pill ${remainSecs()<=120?'tlow':''}" id="tmr">⏱ ${fmtTime(remainSecs())}</span>
    <span class="pill">ข้อ ${G.i+1}/${QN}</span>
    <span class="pill">⭐ ${G.score}</span>
    <button class="exit" onclick="exitQuiz()">ออก</button>
  </div>
  <div class="bar"><div style="width:${(G.i)/QN*100}%"></div></div>
  <div class="card">
    <span class="qsec">${esc(cur.sec)}</span>
    <div class="qtext">${fq(cur.q,cur.fr)}</div>
    ${cur.svg?`<div style="text-align:center;margin:4px 0 10px">${cur.svg}</div>`:''}
    ${cur.choices.map((c,j)=>`<button class="choice" id="ch${j}" onclick="answer(${j})"><span class="kbd">${LET[j]}</span>${fq(c,cur.fr)}</button>`).join('')}
    <div class="fb" id="fb"></div>
    <div class="whybox" id="why">💡 <b>วิธีคิด:</b> ${fq(cur.ex||'',cur.fr)}${cur.exsvg?`<div style="text-align:center;margin-top:6px">${cur.exsvg}</div>`:''}</div>
    <button class="nextbtn" id="nx" onclick="next()">${G.i===QN-1?'ดูผลคะแนน 🏁':'ข้อถัดไป ▶'}</button>
  </div>`;
  window.scrollTo(0,0);
}
function answer(j){
  if(G.answers[G.i]!==undefined)return;
  if(remainSecs()<=0){timeUp();return;}
  const cur=G.qs[G.i];
  G.answers[G.i]=j;
  for(let k=0;k<4;k++)document.getElementById('ch'+k).disabled=true;
  document.getElementById('ch'+cur.correct).classList.add('correct');
  const fb=document.getElementById('fb');
  if(j===cur.correct){
    G.score++;
    fb.className='fb ok';fb.textContent='✓ เก่งมาก! ถูกต้อง';
  }else{
    document.getElementById('ch'+j).classList.add('wrong');
    fb.className='fb no';fb.textContent=`✗ ยังไม่ถูก คำตอบที่ถูกคือ ${LET[cur.correct]}. ${cur.choices[cur.correct]}`;
    if(cur.fr)fb.innerHTML=fq(fb.textContent,true);
  }
  const wy=document.getElementById('why');
  if(wy&&cur.ex)wy.style.display='block';
  document.getElementById('nx').style.display='block';
  if(G.answers.filter(a=>a!==undefined).length>=QN){G.frozenSecs=elapsedSecs();stopTicker();}
  saveProgress(); /* บันทึกทุกข้อที่ตอบ กันหลุดกลางคัน */
}
function next(){
  G.i++;
  if(G.i<QN)renderQ();else finish();
}
function quizRec(status){
  return {chapter:G.ch,score:G.score,total:QN,status,cid:G.cid,
    secs:elapsedSecs(),
    items:G.qs.map((q,j)=>({sec:q.sec,q:q.q,svg:q.svg,ex:q.ex,exsvg:q.exsvg,lv:q.lv,choices:q.choices,correct:q.correct,user:G.answers[j],sig:q.sig,fr:q.fr})),
    sigs:G.qs.map(q=>q.sig).filter(Boolean)};
}
function saveProgress(){
  const rec=quizRec('pending');const g=G;
  localStorage.setItem('mq5_backup',JSON.stringify({cid:g.cid,pendingId:g.pendingId,unsent:true,rec}));
  saveStatus('⌛ กำลังบันทึก...');
  g.saveQ=(g.saveQ||Promise.resolve()).then(async()=>{
    try{
      const res=await apiSave(g.pendingId?Object.assign({},rec,{id:g.pendingId}):rec);
      if(res&&res.id)g.pendingId=res.id;
      localStorage.setItem('mq5_backup',JSON.stringify({cid:g.cid,pendingId:g.pendingId,unsent:false,rec}));saveStatus('💾 บันทึกแล้ว',true);
    }catch(e){saveStatus('⚠️ ยังส่งไม่สำเร็จ จะลองใหม่ข้อถัดไป');}
  });
}
function resumeQuiz(id){
  const r=HIST.find(h=>h.id===id&&h.status==='pending');
  if(!r)return home();
  const lv=r.items&&r.items[0]&&r.items[0].lv?r.items[0].lv:2;
  const answers=r.items.map(it=>(it.user===null||it.user===undefined)?undefined:it.user);
  const qs=(r.items||[]).map(it=>({sec:it.sec,q:it.q,svg:it.svg,ex:it.ex,exsvg:it.exsvg,lv:it.lv||lv,choices:it.choices,correct:it.correct,sig:it.sig,fr:it.fr}));
  let i=0;while(i<qs.length&&answers[i]!==undefined)i++;
  const score=answers.reduce((a,u,j)=>a+(u===qs[j].correct?1:0),0);
  G={ch:r.ch,lv,qs,i,score,answers,t0:Date.now(),secsBase:r.secs||0,pendingId:id,cid:r.cid||null,startTs:r.startTs||r.ts,saveQ:Promise.resolve()};
  if(i>=qs.length){G.frozenSecs=r.secs||0;G.timedOut=(r.secs||0)>(LVTIME[lv]||1800);return finish();}
  if(remainSecs()<=0)return timeUp(); /* เวลาสะสมเกินกำหนดแล้ว */
  startTicker();
  renderQ();
}
function exitQuiz(){
  const n=G.answers.filter(a=>a!==undefined).length;
  if(n===0){
    if(confirm('ออกจากเกม? ยังไม่ได้ตอบสักข้อ รอบนี้จะไม่ถูกบันทึก')){stopTicker();home();}
    return;
  }
  if(confirm(`พักไว้ก่อน? ตอบไปแล้ว ${n}/${QN} ข้อ ระบบบันทึกค้างไว้ให้ (นาฬิกาหยุดเดิน กลับมานับต่อ) กลับมาทำต่อได้จากหน้าหลัก`)){
    stopTicker();
    const g=G;
    showLoading('กำลังบันทึกรอบที่ค้างไว้...');
    saveProgress();(g.saveQ||Promise.resolve()).then(()=>boot());
  }
}
async function finish(){
  stopTicker();
  G.finished=true;
  const rec=quizRec('done');
  rec.timedOut=!!G.timedOut;
  const secs=rec.secs;
  showLoading('กำลังบันทึกคะแนน...');
  let res=null;
  try{
    await (G.saveQ||Promise.resolve()); /* รอ autosave ที่ค้างอยู่ก่อน กันสถานะเด้งกลับเป็น pending */
    if(G.pendingId)rec.id=G.pendingId;
    res=await apiSubmit(rec);
    localStorage.removeItem('mq5_backup');
  }catch(e){
    const saved=G; /* เก็บสถานะไว้ให้กดบันทึกซ้ำ */
    showError('บันทึกคะแนนไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วกดลองใหม่ (คะแนน '+G.score+'/'+QN+' ยังอยู่ครบ)',
      ()=>{G=saved;finish();});
    return;
  }
  if(rec.id)HIST=HIST.filter(h=>h.id!==rec.id);
  HIST.unshift({id:(res&&res.id)||rec.id||null,cid:G.cid,status:'done',timedOut:rec.timedOut,startTs:G.startTs,ts:Date.now(),ch:G.ch,score:G.score,total:QN,secs,items:rec.items});sortHist();
  rec.sigs.forEach(s=>SIGS.add(s));
  const pct=G.score/QN*100;
  const nAns=G.answers.filter(a=>a!==undefined).length;
  const emo=G.timedOut?'⏰':pct>=90?'🏆':pct>=70?'🌟':pct>=50?'💪':'📚';
  const msg=G.timedOut?`หมดเวลา! ตอบทัน ${nAns}/${QN} ข้อ รอบนี้ยังไม่ผ่าน — ต้องทำครบทุกข้อและทันเวลา ลองใหม่นะ สู้ๆ`:pct>=90?'สุดยอดไปเลย! เก่งมากๆ':pct>=70?'เก่งมาก! อีกนิดเดียวเต็มแล้ว':pct>=50?'ดีมาก! ฝึกอีกหน่อยนะ':'ไม่เป็นไร ลองใหม่อีกครั้งนะ สู้ๆ';
  const mm=Math.floor(secs/60),ss=secs%60;

  document.getElementById('app').innerHTML=`

    <div class="restime">${esc(CHNAME[lastCh])} • ระดับ ${LVNAME[G.lv]} • ใช้เวลา ${mm} นาที ${ss} วินาที ${G.timedOut?`— เกินกำหนด ${Math.round((LVTIME[G.lv]||1800)/60)} นาที ⏰ ไม่ผ่าน`:`— ทันเวลา ✓ (กำหนด ${Math.round((LVTIME[G.lv]||1800)/60)} นาที)`} • บันทึกขึ้นระบบแล้ว ✓</div>
    <div class="btnrow">
      ${!G.timedOut&&G.score>=LVPASS&&G.lv<3?`<button class="nextbtn" onclick="startQuiz(${lastCh},${G.lv+1})">⬆️ เก่งมาก! ขยับไประดับ ${LVNAME[G.lv+1]}</button>`:''}
      <button class="nextbtn" onclick="startQuiz(${lastCh},${G.lv})">🔄 ทำชุดใหม่ระดับเดิม (โจทย์ไม่ซ้ำ)</button>

      <button class="nextbtn ghost" onclick="home()">🏠 หน้าหลัก</button>

}

function scoreCls(r){const p=r.score/r.total;return p>=0.8?'good':p>=0.5?'mid':'bad';}
function histRows(limit){
  return HIST.slice(0,limit).map((r,k)=>{

      ${pd?`<span class="scorebadge pend">⏳ ${nAns}/${r.total} ข้อ</span>`:`<span class="scorebadge ${r.timedOut?'tmo':scoreCls(r)}">${r.timedOut?'⏰ ':''}${r.score}/${r.total}</span>`}
      ${r.items&&r.items[0]&&r.items[0].lv?`<span class="lvtag l${r.items[0].lv}">${['','Basic','Normal','Adv.'][r.items[0].lv]}</span>`:''}
      ${pd?(IS_PARENT?`<span class="pendnote">ทำยังไม่เรียบร้อย</span><button class="linkbtn" onclick="review(${k})">ดูที่ทำแล้ว</button>`:`<button class="linkbtn" onclick="resumeQuiz(${r.id})">▶ ทำต่อ</button>`):`<button class="linkbtn" onclick="review(${k})">ดูเฉลย</button>`}
    </div>`;
  }).join('');
}
function home(){
  G=null;
  const PEND={};
  HIST.filter(r=>r.status==='pending').forEach(r=>{
    const n=(r.items||[]).filter(it=>it.user!==undefined&&it.user!==null).length;
    const plv=r.items&&r.items[0]&&r.items[0].lv?r.items[0].lv:2;
    (PEND[r.ch]=PEND[r.ch]||[]).push({id:r.id,n,lv:plv,rm:(LVTIME[plv]||1800)-(r.secs||0)});
  });
  document.getElementById('app').innerHTML=`
  <h1>🧮 เกมคณิตคิดสนุก ป.5 🎯</h1>
  <div class="sub">ตะลุยโจทย์ครั้งละ ${QN} ข้อ จับเวลาเหมือนสอบจริง — 🟢 Basic 20 นาที • 🟡 Normal 30 นาที • 🔴 Advance 40 นาที • ต้องทำครบและทันเวลาจึงจะผ่าน</div>
  ${Object.keys(CHNAME).map(ch=>`<div class="chapbtn ${CHMETA[ch].cls}">
    ${CHMETA[ch].icon} ${CHNAME[ch]}
    <small>${CHMETA[ch].sub}</small>
    <span class="stat">${chStat(+ch)}</span>
    <div class="btnpair">
      <button onclick="startLesson(${ch})">📖 เรียนบทนี้</button>
    </div>
    <div class="btnpair lvpick">
      <button onclick="startQuizUI(${ch},1)">🟢 Basic</button>
      <button onclick="startQuizUI(${ch},2)">🟡 Normal</button>
      <button onclick="startQuizUI(${ch},3)">🔴 Advance</button>
    </div>
    ${(PEND[ch]||[]).map(p=>`<button class="resumebtn" onclick="resumeQuiz(${p.id})">⏳ ทำต่อรอบที่ค้างไว้ — ${p.n}/${QN} ข้อ (${LVNAME[p.lv]}${p.rm>0?` • เหลือเวลา ${Math.max(1,Math.ceil(p.rm/60))} นาที`:' • ⏰ หมดเวลาแล้ว'})</button>`).join('')}
  </div>`).join('')}
  ${HIST.length?`
  <div class="card">
    <div class="sec-title">🗂️ ประวัติการเล่น (ล่าสุด)</div>
    ${histRows(15)}
  </div>`:''}
  <div class="note">คะแนนถูกบันทึกขึ้นระบบอัตโนมัติ เปิดจากเครื่องไหนก็เห็นประวัติเดียวกัน</div>`;
  window.scrollTo(0,0);
}

/* ================= parent dashboard ================= */
function pctColor(p){return p>=80?'#27ae60':p>=50?'#e67e22':'#e74c3c';}
/* หัวข้อทั้งหมดของแต่ละบท — ใช้เช็คว่าส่วนไหนยังไม่ได้ทำ */
const TOPICS={
 1:['ค่าประจำหลัก','การกระจาย','การเปรียบเทียบ','การเรียงลำดับ','ทศนิยมกับเศษส่วน','ค่าประมาณ'],
 2:['การบวกทศนิยม','การลบทศนิยม','หาจำนวนที่หายไป','เปรียบเทียบผลลัพธ์','โจทย์ปัญหา'],
 3:['คูณด้วย 10 100 1000','หารด้วย 10 100 1000','หน่วยความยาว'],
 4:['พื้นที่สี่เหลี่ยมด้านขนาน','แนวคิดฐานและส่วนสูง','เส้นรอบรูป','ชนิดของรูปสี่เหลี่ยม'],
 5:['พื้นที่สามเหลี่ยม','พื้นที่สามเหลี่ยม (ประยุกต์)','พื้นที่รูปหลายเหลี่ยม','แนวคิดฐานและส่วนสูง'],
 6:['การคูณทศนิยม','การหารทศนิยม','โจทย์ปัญหาคูณหารทศนิยม'],
 7:['ลำดับการคำนวณ','โจทย์ปัญหาหลายขั้นตอน'],
 8:['คูณจำนวนเต็ม','หารจำนวนเต็ม','โจทย์ปัญหาคูณหาร','คูณด้วย 10 100 1000','หารด้วย 10 100 1000'],
 9:['ทำเป็นอย่างต่ำ','จำนวนคละ ↔ เศษเกิน','ส่วนร่วมน้อยที่สุด','บวกเศษส่วนต่างส่วน','ลบเศษส่วน / จำนวนคละ','บวกลบสามพจน์','โจทย์ปัญหาเศษส่วน'],
};
function parentHome(){
  G=null;
  const cards=Object.keys(CHNAME).map(ch=>{
    ch=+ch;
    const rs=HIST.filter(r=>r.ch===ch&&r.status!=='pending');
    const n=rs.length;
    const best=n?Math.max(...rs.map(r=>r.score)):0;
    const avg=n?(rs.reduce((a,r)=>a+r.score,0)/n).toFixed(1):'-';
    const bg=CHMETA[ch].grad;
    return `<div class="pcard" style="background:${bg};min-width:210px">
      <div class="lbl">${CHNAME[ch]}</div>
      <div class="big">${n? avg+' / '+QN : '—'}</div>
      <div class="lbl">คะแนนเฉลี่ย • ทำ ${n} ครั้ง • ดีที่สุด ${n?best:'-'}/${QN}</div>
    </div>`;
  }).join('');
  /* วิเคราะห์รายระดับ Basic/Normal/Advance ต่อบท */
  const rlv=r=>r.items&&r.items[0]&&r.items[0].lv?r.items[0].lv:2;
  const lvRows=Object.keys(CHNAME).map(ch=>{
    ch=+ch;
    const pc=[1,2,3].map(lv=>{
      const all=HIST.filter(r=>r.ch===ch&&r.status!=='pending'&&rlv(r)===lv),rs=all.filter(r=>!r.timedOut),to=all.length-rs.length;
      return all.length?{n:rs.length,to,p:rs.length?Math.round(rs.reduce((a,r)=>a+r.score/r.total,0)/rs.length*100):null}:null;
    });
    let rec='ยังไม่เริ่ม — ชวนเริ่มที่ Basic';
    if(pc[2]&&pc[2].p>=70)rec='ผ่าน Advance แล้ว 🏆';
    else if(pc[1]&&pc[1].p>=70)rec='พร้อมลุย Advance';
    else if(pc[0]&&pc[0].p>=70)rec='พร้อมขยับไป Normal';
    else if(pc[0]||pc[1]||pc[2])rec='ควรฝึก Basic เพิ่ม';
    const cells=pc.map(x=>x?x.p===null?`<div class="lvcell"><b>⏰ หมดเวลา ${x.to} ครั้ง</b></div>`:`<div class="lvcell"><b style="color:${pctColor(x.p)}">${x.p}%</b><small>${x.n} รอบ${x.to?` • ⏰ ${x.to}`:''}</small></div>`
      :'<div class="lvcell none">—</div>').join('');
    return `<div class="lvrowp"><div class="lvchapc"><b>บทที่ ${ch}</b><small>${rec}</small></div>${cells}</div>`;
  }).join('');
  /* รอบที่ค้างอยู่ (ทำยังไม่เรียบร้อย) */
  const pendRows=HIST.map((r,k)=>({r,k})).filter(x=>x.r.status==='pending').map(x=>{
    const n=(x.r.items||[]).filter(it=>it.user!==undefined&&it.user!==null).length;
    const c=(x.r.items||[]).filter(it=>it.user!==undefined&&it.user!==null&&it.user===it.correct).length;
    const d=new Date(x.r.ts).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    const plv=x.r.items&&x.r.items[0]&&x.r.items[0].lv?x.r.items[0].lv:2;
    return `<div class="hrow"><span class="tag t${x.r.ch}">บทที่ ${x.r.ch}</span><span>${d}</span><span class="scorebadge pend">⏳ ${n}/${x.r.total} ข้อ</span><span class="lvtag l${plv}">${['','Basic','Normal','Adv.'][plv]}</span><span style="font-size:13px">ถูกแล้ว ${c} ข้อ</span><button class="linkbtn" onclick="review(${x.k})">ดูที่ทำแล้ว</button></div>`;
  }).join('');
  /* สรุปความแม่นยำรายหัวข้อ — โชว์ครบทุกหัวข้อของทุกบท หัวข้อที่ยังไม่เคยทำติดป้ายไว้ */
  const tstat={};
  HIST.forEach(r=>(r.items||[]).forEach(it=>{
    if(it.user===undefined||it.user===null)return; /* ข้อที่ยังไม่ได้ทำ ไม่นับสถิติ */
    const k=r.ch+'|'+it.sec;
    if(!tstat[k])tstat[k]={n:0,c:0};
    tstat[k].n++;
    if(it.user===it.correct)tstat[k].c++;
  }));
  let doneT=0,allT=0;
  const topicRows=Object.keys(TOPICS).map(ch=>{
    const rows=TOPICS[ch].map(sec=>{
      allT++;
      const t=tstat[ch+'|'+sec];
      if(t)doneT++;
      return {sec,t,p:t?Math.round(t.c/t.n*100):-1};
    }).sort((a,b)=>a.p-b.p)
    .map(o=>o.t?`<div class="topicrow">
        <span class="tname">${esc(o.sec)}</span>
        <div class="tbar"><div style="width:${o.p}%;background:${pctColor(o.p)}"></div></div>
        <span class="tpct">${o.p}% (${o.t.c}/${o.t.n})</span>
      </div>`
      :`<div class="topicrow tnone">
        <span class="tname">${esc(o.sec)}</span>
        <div class="tbar"></div>
        <span class="tpct">ยังไม่ได้ทำ</span>
      </div>`).join('');
    return `<div class="tchap">${CHNAME[ch]}</div>`+rows;
  }).join('');
  const topicSub=`<div style="font-size:13.5px;color:#8a90ad;margin:-4px 0 6px">ทำแล้ว ${doneT} จาก ${allT} หัวข้อ • ในแต่ละบทเรียงจากจุดที่ควรฝึกเพิ่ม (แถบลายทาง = ยังไม่เคยทำ)</div>`;
  document.getElementById('app').innerHTML=`
  <h1>👨‍👩‍👧 หน้าสรุปสำหรับผู้ปกครอง</h1>
  <div class="sub">เกมทศนิยม ป.5 — สรุปจาก 50 รอบล่าสุด (รอบค้างแสดงครบทุกรายการ)</div>
  <div class="pgrid">${cards}</div>
  ${pendRows?`<div class="card" style="margin-top:16px">
    <div class="sec-title">⏳ รอบที่ทำยังไม่เรียบร้อย — ให้ลูกกลับมาทำต่อได้</div>
    <div style="font-size:13.5px;color:#8a90ad;margin:-4px 0 6px">เก็บโจทย์ทั้งชุดและคำตอบที่ทำไปแล้วไว้ครบ สถานะจะเปลี่ยนเป็นเสร็จเมื่อทำครบ 20 ข้อ</div>
    ${pendRows}
  </div>`:''}
  <div class="card" style="margin-top:16px">
    <div class="sec-title">📶 ระดับความเข้าใจ (Basic → Normal → Advance)</div>
    <div style="font-size:13.5px;color:#8a90ad;margin:-4px 0 8px">คะแนนเฉลี่ยของแต่ละระดับ — ได้ 70% ขึ้นไปถือว่าผ่าน พร้อมขยับระดับถัดไป</div>
    <div class="lvrowp lvhead"><div></div><div>🟢 Basic</div><div>🟡 Normal</div><div>🔴 Advance</div></div>
    ${lvRows}
  </div>
  <div class="card" style="margin-top:16px">
    <div class="sec-title">🎯 ความแม่นยำรายหัวข้อ ครบทุกบท</div>
    ${topicSub}
    ${topicRows}
  </div>
  <div class="card">
    <div class="sec-title">🗂️ ประวัติการทำ (50 รอบล่าสุด)</div>
    ${histRows(50)||'<div style="font-size:14px;color:#8a90ad">ยังไม่มีข้อมูล</div>'}
  </div>
  <div class="note">หน้าเด็กทำโจทย์: เปิด index.html (ลิงก์หลักของเว็บ)</div>`;
  window.scrollTo(0,0);
}

boot();
</script>
